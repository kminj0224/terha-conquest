name: Verify and release unit balance v1.11.95
on:
  push:
    branches: [codex/unit-balance-v11195]
permissions:
  contents: write
concurrency:
  group: unit-balance-v11195
  cancel-in-progress: false
jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Prepare regression dependencies and music
        run: |
          npm ci --no-audit --no-fund
          python3 tools/prepare_operation_music.py
      - name: Verify unit balance, airborne, AI, shared engine and native shell
        run: |
          node qa/balance-v11195-native.cjs
          node qa/airborne-regression-native.cjs
          node qa/conquest-ai-simulation.cjs
          node qa/balance-logistics-native.cjs
          npm test
          python3 qa/verify-native.py
      - name: Build signed update APK
        run: python3 build.py
      - name: Verify package, version, original certificate and source assets
        run: |
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.11.95.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.95.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.95.apk > SHA256SUMS-v1.11.95.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.11.95
          path: |
            deliverables/Terha-Conquest-v1.11.95.apk
            deliverables/SHA256SUMS-v1.11.95.txt
          if-no-files-found: error
      - name: Publish APK after verified source reaches main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 180); do
            main_sha=$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)
            if [ "$main_sha" = "$GITHUB_SHA" ]; then
              if gh release view v1.11.95 >/dev/null 2>&1; then
                test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.11.95 --jq .object.sha)" = "$GITHUB_SHA"
                gh release upload v1.11.95 deliverables/Terha-Conquest-v1.11.95.apk deliverables/SHA256SUMS-v1.11.95.txt --clobber
              else
                gh release create v1.11.95 deliverables/Terha-Conquest-v1.11.95.apk deliverables/SHA256SUMS-v1.11.95.txt --target "$GITHUB_SHA" --title '테르하 : 낙원의 기억 v1.11.95' --notes-file docs/releases/v1.11.95.md
              fi
              exit 0
            fi
            sleep 5
          done
          echo 'Verified source has not reached main; APK release withheld.' >&2
          exit 1
