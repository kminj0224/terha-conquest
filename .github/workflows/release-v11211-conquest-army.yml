name: Verify and release conquest starting armies APK v1.12.11
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webp-v11211-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/balance/conquest-starting-army'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp python3-pil
          npm ci --no-audit --no-fund
      - name: Check conquest, campaign and native shell regressions
        run: |
          python3 tools/prepare_operation_music.py
          python3 tools/prepare_main_airia_assets.py
          npm test
          node qa/conquest-ai-simulation.cjs
          python3 qa/verify-native.py
      - name: Build and verify the signed APK
        run: |
          python3 build.py
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.12.11.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.12.11.apk
          echo "$GITHUB_SHA" > deliverables/SOURCE_COMMIT
          cd deliverables
          sha256sum Terha-Conquest-v1.12.11.apk webp-conversion-report.json SOURCE_COMMIT > SHA256SUMS-v1.12.11.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.12.11
          path: |
            deliverables/Terha-Conquest-v1.12.11.apk
            deliverables/webp-conversion-report.json
            deliverables/SOURCE_COMMIT
            deliverables/SHA256SUMS-v1.12.11.txt
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve and verify the artifact for this main commit
        run: |
          run_id=$(gh run list --workflow release-v11211-conquest-army.yml --branch balance/conquest-starting-army --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          gh run download "$run_id" --name Terha-Conquest-v1.12.11 --dir deliverables
          (cd deliverables && sha256sum -c SHA256SUMS-v1.12.11.txt && test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA")
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.12.11.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.12.11.apk
      - name: Publish the signed main release
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view v1.12.11 >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.12.11 --jq .object.sha)" = "$GITHUB_SHA"
            gh release upload v1.12.11 deliverables/Terha-Conquest-v1.12.11.apk deliverables/webp-conversion-report.json deliverables/SHA256SUMS-v1.12.11.txt deliverables/SOURCE_COMMIT --clobber
          else
            gh release create v1.12.11 deliverables/Terha-Conquest-v1.12.11.apk deliverables/webp-conversion-report.json deliverables/SHA256SUMS-v1.12.11.txt deliverables/SOURCE_COMMIT --target "$GITHUB_SHA" --title '테르하 낙원의 기억 v1.12.11 — 정복 시작 병력 조정' --notes-file docs/releases/v1.12.11.md
          fi
