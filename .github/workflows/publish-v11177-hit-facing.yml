name: Publish reversed blood and sparks v1.11.77 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v11177-hit-facing.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v11177
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify bridge pointer input, directional hits and unchanged combat rules
        run: |
          npm ci --no-audit --no-fund
          python3 tools/prepare_operation_music.py
          node qa/release-v11176-native.cjs
          node qa/combat-animation-native.cjs
          node qa/combat-impact-routing-native.cjs
          node qa/conquest-ai-simulation.cjs
          node qa/supply-network-regression.cjs
          python3 qa/verify-native.py
      - name: Build and verify original update certificate
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.77.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.77.apk > SHA256SUMS-v1.11.77.txt
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.77 >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.11.77 --jq .object.sha)" = "$GITHUB_SHA"
            gh release upload v1.11.77 deliverables/Terha-Conquest-v1.11.77.apk deliverables/SHA256SUMS-v1.11.77.txt --clobber
          else
            gh release create v1.11.77 deliverables/Terha-Conquest-v1.11.77.apk deliverables/SHA256SUMS-v1.11.77.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.77 — 피·스파크 좌우 방향 반전 수정' --notes-file docs/releases/v1.11.77.md
          fi
          gh release view v1.11.77 --json url,assets
