name: Build v1.11.26 campaign artwork music and Ranna wars
on:
  push:
    branches: [main]
    paths:
      - 'game/assets/campaign-loading.js'
      - '.github/workflows/build-v11126-campaign.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Mortar, Ranna war and loading artwork regression checks
        run: |
          node - <<'JS'
          const fs=require('fs'),source=fs.readFileSync('qa/native-test.cjs','utf8'),cut=source.indexOf("\nassert.equal(run('appScreen'),'title')");
          if(cut<0)throw Error('Native harness boundary missing');
          fs.writeFileSync('qa/.focused-special.cjs',source.slice(0,cut)+"\n(async()=>{await Promise.all(pending);await require('./mortar-art-regression.cjs')({run});await require('./campaign-v11126-regression.cjs')({run});process.exit(0)})().catch(e=>{console.error(e);process.exit(1)});");
          JS
          node qa/.focused-special.cjs
          rm qa/.focused-special.cjs
      - run: node qa/operation-music-regression.cjs
      - name: Native renderer and gameplay regression checks
        run: |
          mkdir -p previews
          npm test
          node qa/mountain-tile-alignment.cjs
          node qa/ocean-world-regression.cjs
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.26.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.26.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: Terha-Conquest-v1.11.26
          path: |
            deliverables/*
            previews/mortar-art-*.png
          retention-days: 14
      - name: Publish verified APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.26 deliverables/Terha-Conquest-v1.11.26.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.26' --notes 'Mortar travel artwork -35%, stationary artwork +15%. Shadow Pulse, Last light, Ghost Trail, Lopsided Pulse playlist. Five persistent rotating fullscreen loading artworks. AI Ranna declares war on surviving countries after Nakwol falls. Save compatibility and original Android update signature preserved. versionCode 171.'
