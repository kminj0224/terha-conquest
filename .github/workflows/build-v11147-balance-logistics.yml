name: Balance and national logistics v1.11.47 APK
on:
  push:
    branches: [main, codex/balance-logistics-v11147]
    paths: ['game/assets/**', 'qa/**', 'build.py', '.github/workflows/build-v11147-balance-logistics.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify balance, all factions, national research and transport provenance
        run: |
          python3 tools/prepare_operation_music.py
          node qa/balance-logistics-native.cjs
          node qa/sapros-regression.cjs
          node qa/supply-routes-regression.cjs
          node qa/supply-network-regression.cjs
          node qa/siege-occupation-regression.cjs
          node qa/supply-network-native.cjs
          npm test
          python3 qa/verify-native.py
      - name: Build signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.47.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.47.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.11.47
          path: deliverables/*
      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.47 deliverables/Terha-Conquest-v1.11.47.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.47' --notes '유닛 설명 중복 제거, 유닛·반격 밸런스 조정, 국가 공통 연비 개선과 수송로 개선, 전 국가 AI 생산 검사 및 다양성 개선, 무료 수송선 지급 한도 축소. versionCode 192. 기존 업데이트 서명 유지.'
