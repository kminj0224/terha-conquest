name: Build v1.11.29 Ayria infantry APK
on:
  push:
    branches: [main]
    paths:
      - 'game/assets/ayria-*.webp'
      - 'game/assets/rifle-art.js'
      - 'game/assets/infantry-fire.js'
      - 'game/assets/saves.js'
      - 'game/assets/app-shell.js'
      - 'build.py'
      - 'qa/ayria-infantry-regression.cjs'
      - '.github/workflows/build-v11129-ayria-alignment.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run gameplay and Ayria sprite regression checks
        run: |
          python3 tools/prepare_operation_music.py
          node qa/ayria-infantry-regression.cjs
          npm test
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.29.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.29.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Terha-Conquest-v1.11.29
          path: |
            deliverables/Terha-Conquest-v1.11.29.apk
            deliverables/SHA256SUMS.txt
          retention-days: 14
      - name: Publish signed APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.29 deliverables/Terha-Conquest-v1.11.29.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.29' --notes 'Ayria infantry fix: original-resolution lossless artwork, natural frame proportions, anchored boots, corrected rifle/grenade/machine gun muzzle flashes and anti-tank launch smoke. Existing gameplay, save compatibility and Android signing identity preserved. versionCode 174.'

