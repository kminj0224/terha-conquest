name: Check APK runtime assets
on:
  pull_request:
    paths:
      - 'game/assets/**'
      - 'build.py'
      - 'tools/apk_assets.py'
      - 'qa/check-apk-assets.py'
      - '.github/workflows/apk-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - name: Verify shared game and build signed APK with inventory checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp python3-pil
          npm ci --no-audit --no-fund
          python3 tools/prepare_operation_music.py
          python3 tools/prepare_main_airia_assets.py
          npm test
          python3 qa/verify-native.py
          python3 build.py
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.12.2.apk
