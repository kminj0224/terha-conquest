name: Build v1.11.22 special operations
on:
  push:
    branches: [main]
    paths:
      - 'game/assets/special-operations.js'
      - 'game/assets/devil-rider-art.js'
      - 'game/assets/rifle-art.js'
      - 'game/assets/frontline-reinforcements.js'
      - 'qa/special-operations-regression.cjs'
      - '.github/workflows/build-v11122-special-operations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Native renderer and gameplay regression checks
        run: |
          mkdir -p previews
          npm test
          node qa/mountain-tile-alignment.cjs
          node qa/ocean-world-regression.cjs
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.22.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.22.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: Terha-Conquest-v1.11.22
          path: |
            deliverables/*
            previews/special-operations-*.png
          retention-days: 14
      - name: Publish verified APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.22 deliverables/Terha-Conquest-v1.11.22.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.22 — Special Operations' --notes 'Special units can be produced in capitals and level 4+ cities. Black Legion attacks twice per turn. Dante Devil Rider is replaced in place by Commando Legion infantry: base HP 130, attack 55, movement 13, 20% smaller artwork and muzzle flashes with infantry hit effects (no flying bullets). Black Legion artwork is 10% larger. AI invests in city upgrades, protects expansion gold and prioritizes affordable special formations every turn. Save IDs, map and original Android update signing identity retained. New campaigns replace two forward Baekyang elite tanks with four anti-tank infantry and retain one southern forward destroyer. versionCode 167.'
