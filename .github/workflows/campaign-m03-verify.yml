name: Mission 03 and cyberpunk campaign verification
on:
  push:
    branches: [codex/mission03]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - run: python3 tools/prepare_operation_music.py
      - name: Full native campaign regression and actual mission02 to mission03 playthrough
        run: npm test
      - name: Campaign artwork, story and save flow in Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install chromium
          node qa/battlefield-layout.cjs
          node qa/campaign-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mission03-review
          path: qa/campaign-previews/*
