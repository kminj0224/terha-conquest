name: Build Terha Conquest v1.10.82 Nakwol commando and fuel research validated
on:
  push:
    paths:
      - '.github/workflows/build-v11082-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check imported Nakwol commando and Mecha Knight sprite files
        run: |
          test -s game/assets/nakwol-commando-idle.webp
          test -s game/assets/nakwol-commando-fire.webp
          test -s game/assets/mecha-knight-new.webp
          test -s game/assets/v11082-special-fuel.js
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund
      - name: Test original systems and v1.10.82 special unit / fuel research
        run: node qa/native-test.cjs
      - name: Verify Android native shell
        run: python3 qa/verify-native.py
      - name: Build v1.10.82 signed APK
        run: python3 build.py
      - name: Verify original signing certificate and SHA-256
        run: |
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.10.82.apk
          sha256sum deliverables/Terha-Conquest-v1.10.82.apk > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.10.82
          path: |
            deliverables/Terha-Conquest-v1.10.82.apk
            deliverables/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
