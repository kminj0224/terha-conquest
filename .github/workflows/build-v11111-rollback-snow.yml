name: Build v1.11.11 from v1.11.9 with snow territory correction only
on:
  push:
    branches: [work/rollback-snow-v11111]
    paths: ['.github/workflows/build-v11111-rollback-snow.yml']
  workflow_dispatch:
concurrency:
  group: aligned-map-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Bake v1.11.9 artwork with only snow territory changes
        run: |
          node tools/bake-aligned-map.cjs
          node tools/build-map-lods.cjs
      - name: Verify rollback scope, original palette and immutable geography
        run: |
          node qa/rollback-snow-scope.cjs
          node qa/terrain-style-regression.cjs
          node qa/aligned-map-regression.cjs
      - name: Verify conquest colors and protected white snow
        run: |
          node qa/snow-territory-regression.cjs
          node qa/scenery-ownership-regression.cjs
          node qa/territory-lod-regression.cjs
      - name: Runtime, pan, gameplay and native checks
        run: |
          node qa/hd-map-regression.cjs
          node qa/terrain-pan-benchmark.cjs --assert
          npm test
          node qa/natural-map-view.cjs
          python3 qa/verify-native.py
      - name: Build and verify original signed update
        run: |
          python3 build.py
          python3 - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          apk=Path('deliverables/Terha-Conquest-v1.11.11.apk')
          with zipfile.ZipFile(apk) as z,zipfile.ZipFile('android/native-shell.zip') as shell:
            assert z.testzip() is None
            assert z.read('classes.dex')==shell.read('classes.dex')
          Path('deliverables/SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest()+'  '+apk.name+'\n')
          assert "VERSION='1.11.11';CODE=156" in Path('build.py').read_text()
          PY
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.11.apk
      - name: Retain corrected map and fast-forward rolled-back main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/assets/natural-detail-*.jpg game/assets/natural-mid-*.jpg game/assets/world-natural.png game/assets/world-natural-land.png game/assets/world-ownership-mask.png game/assets/natural-ownership-data.js art/aligned-map-manifest.json art/terrain-alignment-audit.json art/ownership-probes.json art/map-lod-report.json art/river-mouth-audit.json
          git diff --cached --quiet || git commit -m 'Retain v1.11.9 artwork with only snow territory correction for v1.11.11'
          git push origin HEAD:work/rollback-snow-v11111
          git fetch origin main
          test "$(git rev-parse origin/main)" = 9c3700aa4506859eb2e539f3ba4051439669c0bb
          git push origin HEAD:main
      - name: Publish APK directly to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.11 deliverables/Terha-Conquest-v1.11.11.apk deliverables/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --title 'Terha Conquest v1.11.11 — v1.11.9 rollback and snow territory fix' --notes 'Fully rolls back v1.11.10 to v1.11.9. The only map change is in Sielun and the northern Baekyang island: plains and snow-free mountain/tree surfaces follow the current territory owner, while actual snow stays white on conquest. Original v1.11.9 palette, art shapes, density, placements, coastline, rivers, gameplay and performance cache retained. Signed with the original Android update certificate; version code 156.'
# Reference data excludes unused placement lists to keep upload lossless.
