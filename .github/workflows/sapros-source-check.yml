name: Sapros source checkout
on:
  push:
    branches: [codex/sapros-v11141]
    paths: ['.github/workflows/sapros-source-check.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git -czf /tmp/terha-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: sapros-source
          path: /tmp/terha-source.tar.gz
          retention-days: 1
