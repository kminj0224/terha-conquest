name: Publish Terha Conquest v1.10.92 Direct APK
on:
  push:
    paths:
      - '.github/workflows/publish-v11092-apk.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified signed APK pieces from successful test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables sums
          for n in 00 01 02; do
            mkdir -p "parts/${n}"
            gh run download 39194771214 --name "Terha-v11092-part${n}" --dir "parts/${n}"
          done
          gh run download 39194771214 --name Terha-v11092-SHA256 --dir sums
          for n in 00 01 02; do
            cat "parts/${n}/Terha-Conquest-v1.10.92.apk.part${n}" >> deliverables/Terha-Conquest-v1.10.92.apk
          done
          sha256sum -c sums/SHA256SUMS.txt
          test -s deliverables/Terha-Conquest-v1.10.92.apk
      - name: Publish directly downloadable original-signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.92 >/dev/null 2>&1; then
            gh release upload v1.10.92 deliverables/Terha-Conquest-v1.10.92.apk --clobber
          else
            gh release create v1.10.92 deliverables/Terha-Conquest-v1.10.92.apk --target "$GITHUB_SHA" --title "Terha Conquest v1.10.92" --notes "Signed Android APK. Dante carrier/destroyer/frigate visuals and owner-based terrain tint. Existing mountain/forest art, game logic, save data and original app signing retained. Full regression passed."
          fi
          gh release view v1.10.92 --json url,assets
