name: Publish Terha Conquest v1.10.91 Direct APK
on:
  push:
    paths:
      - '.github/workflows/publish-v11091-apk.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified signed APK pieces from successful test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables sums
          for n in 00 01 02; do
            mkdir -p "parts/${n}"
            gh run download 39186360449 --name "Terha-v11091-part${n}" --dir "parts/${n}"
          done
          gh run download 39186360449 --name Terha-v11091-SHA256 --dir sums
          for n in 00 01 02; do
            cat "parts/${n}/Terha-Conquest-v1.10.91.apk.part${n}" >> deliverables/Terha-Conquest-v1.10.91.apk
          done
          sha256sum -c sums/SHA256SUMS.txt
          test -s deliverables/Terha-Conquest-v1.10.91.apk
      - name: Publish directly downloadable original-signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.91 >/dev/null 2>&1; then
            gh release upload v1.10.91 deliverables/Terha-Conquest-v1.10.91.apk --clobber
          else
            gh release create v1.10.91 deliverables/Terha-Conquest-v1.10.91.apk --target "$GITHUB_SHA" --title "Terha Conquest v1.10.91" --notes "Signed Android APK. Select nuclear payload to aim immediately for strategic bombers and ballistic missiles; cancelling unloads it; completed facilities notify players; units retaliate within their real range; AA/SAM air-damage impact numbers reflect actual HP loss. No new tutorial text. Regression and original signing verified."
          fi
          gh release view v1.10.91 --json url,assets
