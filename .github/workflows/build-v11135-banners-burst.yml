name: Build v1.11.35 banners, burst audio and Ayria art APK
on:
  push:
    branches: [main, codex/banners-burst]
    paths:
      - 'game/assets/**'
      - 'qa/**'
      - 'build.py'
      - '.github/workflows/build-v11135-banners-burst.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run game and native shell regression checks
        run: |
          python3 tools/prepare_operation_music.py
          node qa/burst-audio-regression.cjs
          node qa/ayria-infantry-regression.cjs
          npm test
          python3 qa/verify-native.py
          node qa/supply-routes-regression.cjs
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.35.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.35.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Terha-Conquest-v1.11.35
          path: |
            deliverables/Terha-Conquest-v1.11.35.apk
            deliverables/SHA256SUMS.txt
          retention-days: 14
      - name: Publish signed APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.35 deliverables/Terha-Conquest-v1.11.35.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.35' --notes '해군 전용 출항·입항 안내, 본토 도시 선택 시 시점 유지, 점령도시 생산 표시와 원 본토도시명, 소총수 3점사와 울림, 첨부 원본 아이리아 대전차보병·중기관총병. versionCode 180.'
