name: Verify Gardara guard artwork and muzzle alignment

on:
  pull_request:
    branches: [main]
    paths:
      - 'game/assets/gardara.js'
      - 'game/assets/gardara-guard-idle.webp'
      - 'game/assets/gardara-guard-fire.webp'
      - 'qa/gardara-special-art-native.cjs'
      - '.github/workflows/gardara-guard-pr-regression.yml'

permissions:
  contents: read

jobs:
  gardara-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up FFmpeg and FFprobe
        uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify transferred image binaries
        run: |
          echo 'af24a70b39e7f915fa5a3dea6de7b62ec69b97647225251b4bb02c3d20b7d84c  game/assets/gardara-guard-idle.webp' | sha256sum -c -
          echo 'eb55da23160b4b449740140f46f0c6864bdc1c14a13ff01e693c46fd2794fdc8  game/assets/gardara-guard-fire.webp' | sha256sum -c -
      - name: Install native test dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare offline music
        run: python3 tools/prepare_operation_music.py
      - name: Verify Gardara special image and firing muzzle effects
        run: node qa/gardara-special-art-native.cjs
      - name: Verify Gardara gameplay and render continuity
        run: node qa/gardara-regression.cjs
