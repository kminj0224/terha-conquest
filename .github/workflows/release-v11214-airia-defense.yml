name: Verify and release Golden Harbor defense APK v1.12.14
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v11214-airia-defense.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v11214
  cancel-in-progress: true
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - name: Prepare WebP and Pillow
        timeout-minutes: 5
        run: |
          if ! command -v cwebp >/dev/null || ! python3 -c 'import PIL'; then
            flags=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            if ! sudo timeout 80s apt-get "${flags[@]}" install -y webp python3-pil; then
              sudo timeout 80s apt-get "${flags[@]}" update
              sudo timeout 80s apt-get "${flags[@]}" install -y webp python3-pil
            fi
          fi
          cwebp -version
          python3 -c 'from PIL import Image'
      - name: Install Node test packages
        timeout-minutes: 5
        env:
          npm_config_fetch_retries: 1
          npm_config_fetch_timeout: 30000
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.51.1
      - name: Locate Chromium for browser verification
        timeout-minutes: 5
        run: |
          chrome=$(command -v google-chrome || command -v chromium || true)
          if [[ -n "$chrome" ]]; then
            echo "TERHA_CHROME_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Verify gameplay and Android shell
        run: |
          python3 tools/prepare_operation_music.py
          python3 tools/prepare_main_airia_assets.py
          npm test
          python3 qa/verify-native.py
          node qa/main-airia-browser.cjs
          node qa/main-airia-defense-browser.cjs
          node qa/main-campaign-intro-browser.cjs
          node qa/campaign-browser.cjs
      - name: Build and verify the signed Android update
        run: |
          python3 build.py
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.12.14.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.12.14.apk
          TERHA_TEST_ROOT="$PWD/android/build/webp" node qa/main-airia-defense-browser.cjs
          echo "$GITHUB_SHA" > deliverables/SOURCE_COMMIT
          cd deliverables
          sha256sum Terha-Conquest-v1.12.14.apk webp-conversion-report.json SOURCE_COMMIT > SHA256SUMS-v1.12.14.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.12.14
          path: |
            deliverables/Terha-Conquest-v1.12.14.apk
            deliverables/webp-conversion-report.json
            deliverables/SOURCE_COMMIT
            deliverables/SHA256SUMS-v1.12.14.txt
          if-no-files-found: error
      - name: Publish the signed APK for this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          assets=(deliverables/Terha-Conquest-v1.12.14.apk deliverables/webp-conversion-report.json deliverables/SHA256SUMS-v1.12.14.txt deliverables/SOURCE_COMMIT)
          if gh release view v1.12.14 >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.12.14 --jq .object.sha)" = "$GITHUB_SHA"
            gh release upload v1.12.14 "${assets[@]}" --clobber
          else
            gh release create v1.12.14 "${assets[@]}" --target "$GITHUB_SHA" --title '테르하 낙원의 기억 v1.12.14 — 황금항 방어전' --notes-file docs/releases/v1.12.14.md
          fi
