name: Publish Gardara depth and artillery v1.11.74 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v11174-gardara-depth.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v11174
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify official map, actual rendering, capture and signature
        run: |
          npm ci --no-audit --no-fund
          python3 tools/prepare_operation_music.py
          node qa/gardara-render-regression.cjs
          node qa/combat-impact-routing-native.cjs
          node qa/illustrated-combat-native.cjs
          node qa/ocean-world-regression.cjs
          python3 qa/verify-native.py
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.74.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.74.apk > SHA256SUMS-v1.11.74.txt
      - name: Publish permanent APK and actual map previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.74 >/dev/null 2>&1; then
            gh release upload v1.11.74 deliverables/Terha-Conquest-v1.11.74.apk deliverables/SHA256SUMS-v1.11.74.txt previews/Gardara-artillery-v1.11.74.png --clobber
          else
            gh release create v1.11.74 deliverables/Terha-Conquest-v1.11.74.apk deliverables/SHA256SUMS-v1.11.74.txt previews/Gardara-artillery-v1.11.74.png --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.74 — 국적 깃발 깊이·가르다라 자주포' --notes '세계지도 좌우 경계의 장면을 합쳐 지면 기준으로 한 번에 정렬. 뒤쪽 국적 깃발이 앞쪽 유닛을 덮는 문제 수정. 모든 국가에 공통 적용. 가르다라 자주포에 첨부된 기본·발사 이미지 원본 적용 및 포구·방향 연결. 일반 도시 4종을 백양 원본에서 지붕색 변형으로 교체하고 백양의 동일 crop·크기·바닥 기준점을 재사용. 수도 전용 이미지는 유지. 기존 저장 유지. 경계 앞뒤 국적 깃발·유닛 순서, 실제 기본·발사 이미지, 좌우 포구, 해양 연결, 전투 효과 깊이, Android 서명 검사. versionCode 219.'
          fi
          gh release view v1.11.74 --json url,assets
