name: Verify and release air superiority APK v1.12.3
on:
  push:
    branches: [main, feat/air-superiority]
    paths: ['.github/workflows/release-v11203-air-superiority.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: air-superiority-v11203-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/air-superiority'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - name: Install lossless encoder and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp python3-pil
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify actual source engine, old saves and native shell
        run: |
          python3 tools/prepare_operation_music.py
          python3 tools/prepare_main_airia_assets.py
          node qa/air-superiority-native.cjs
          npm test
          node qa/airborne-regression-native.cjs
          node qa/main-campaign-intro-native.cjs
          node qa/presentation-audio-regression.cjs
          python3 qa/verify-native.py
      - name: Verify actual production, patrol and forecast UI
        run: node qa/air-superiority-browser.cjs
      - name: Build lossless signed release on GitHub runner
        run: |
          python3 build.py
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.12.3.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.12.3.apk
      - name: Verify shipped WebP bundle and shared campaign
        env:
          TERHA_TEST_ROOT: ${{ github.workspace }}/android/build/webp
        run: |
          node qa/air-superiority-browser.cjs
          node qa/hud-flags-browser.cjs
          node qa/campaign-browser.cjs
      - name: Record exact source commit and checksums
        run: |
          echo "$GITHUB_SHA" > deliverables/SOURCE_COMMIT
          cd deliverables
          sha256sum Terha-Conquest-v1.12.3.apk webp-conversion-report.json SOURCE_COMMIT > SHA256SUMS-v1.12.3.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.12.3
          path: |
            deliverables/Terha-Conquest-v1.12.3.apk
            deliverables/webp-conversion-report.json
            deliverables/SOURCE_COMMIT
            deliverables/SHA256SUMS-v1.12.3.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Air-superiority-browser-checks
          path: qa/campaign-previews/
          if-no-files-found: ignore
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve successfully verified artifact for this exact commit
        run: |
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          run_id=$(gh run list --workflow release-v11203-air-superiority.yml --branch feat/air-superiority --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          gh run download "$run_id" --name Terha-Conquest-v1.12.3 --dir deliverables
          cd deliverables
          sha256sum -c SHA256SUMS-v1.12.3.txt
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
      - name: Recheck APK name and original update certificate
        run: |
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.12.3.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.12.3.apk
      - name: Publish verified APK release
        run: |
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view v1.12.3 >/dev/null 2>&1; then
            test "$(gh release view v1.12.3 --json isDraft --jq .isDraft)" = true
          else
            gh release create v1.12.3 --draft --target "$GITHUB_SHA" --title '테르하 : 낙원의 기억 v1.12.3 — 제공권' --notes-file docs/releases/v1.12.3.md
          fi
          gh release upload v1.12.3 deliverables/Terha-Conquest-v1.12.3.apk deliverables/webp-conversion-report.json deliverables/SOURCE_COMMIT deliverables/SHA256SUMS-v1.12.3.txt --clobber
          gh release edit v1.12.3 --draft=false --latest
