name: Build Terha Conquest v1.11.1 Natural Map
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v11101-natural-map.yml'
      - 'game/assets/map-quality.js'
      - 'game/assets/rivers.js'
      - 'game/assets/terrain.js'
      - 'game/assets/static-ground.js'
      - 'game/assets/index.html'
      - 'game/assets/app-shell.js'
      - 'game/assets/saves.js'
      - 'build.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install regression dependencies
        run: npm ci --no-audit --no-fund
      - name: Run native Canvas game regression suite
        run: npm test
      - name: Verify unchanged native Android shell
        run: python3 qa/verify-native.py
      - name: Validate map rendering dependencies and release identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path('game/assets/index.html').read_text()
          for name in ['river-data.js','rivers.js','map-quality.js','static-ground.js']:
              assert page.count('src="'+name+'"')==1, name
          assert page.index('river-data.js')<page.index('rivers.js')<page.index('map-quality.js')<page.index('bootstrap.js')
          src=Path('game/assets/static-ground.js').read_text()
          assert 'paintMapAtmosphere(g)' in src
          assert 'paintMapRiverFinish(g)' in src
          b=Path('build.py').read_text()
          assert "VERSION='1.11.1';CODE=146" in b
          print('Map pipeline and version verified')
          PY
      - name: Build signed v1.11.1 APK
        run: python3 build.py
      - name: Verify APK content, manifest and signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct
          apk=Path('deliverables/Terha-Conquest-v1.11.1.apk')
          assert apk.is_file() and apk.stat().st_size>30_000_000
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert b'prepareMapWaterDetail' in z.read('assets/map-quality.js')
              assert b'paintMapRiverFinish(g)' in z.read('assets/static-ground.js')
              assert b'rivers.js' in z.read('assets/index.html')
              xml=z.read('AndroidManifest.xml')
          off=8;strings=[];codes=[]
          while off<len(xml):
              kind,head,size=struct.unpack_from('<HHI',xml,off)
              assert size>0
              if kind==1:
                  count,_,flags,start,_=struct.unpack_from('<IIIII',xml,off+8)
                  assert not flags&0x100
                  for j in range(count):
                      q=off+start+struct.unpack_from('<I',xml,off+head+4*j)[0]
                      n=struct.unpack_from('<H',xml,q)[0]
                      strings.append(xml[q+2:q+2+2*n].decode('utf-16le'))
              if kind==0x102:
                  begin,sz,count=struct.unpack_from('<HHH',xml,off+24)
                  for j in range(count):
                      q=off+16+begin+j*sz
                      key=strings[struct.unpack_from('<I',xml,q+4)[0]]
                      if key=='versionCode':codes.append(struct.unpack_from('<I',xml,q+16)[0])
              off+=size
          assert codes==[146],codes
          assert '1.11.1' in strings,strings
          print('APK integrity, assets and monotonic version passed')
          PY
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.1.apk
          cd deliverables && sha256sum Terha-Conquest-v1.11.1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.11.1-natural-map
          path: |
            deliverables/Terha-Conquest-v1.11.1.apk
            deliverables/SHA256SUMS.txt
          retention-days: 30
          compression-level: 0
      - name: Publish downloadable signed APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.11.1
          apk=deliverables/Terha-Conquest-v1.11.1.apk
          sums=deliverables/SHA256SUMS.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$sums" --clobber
          else
            gh release create "$tag" "$apk" "$sums" --target "${{ github.sha }}" --title "Terha Conquest v1.11.1 — Natural Map" --notes "Map-wide deterministic coast surf, ocean texture, curved river overlay, and larger forest/mountain art clipping bounds. Existing geography, saves and Android signing identity preserved."
          fi
          gh release view "$tag" --json url,assets
