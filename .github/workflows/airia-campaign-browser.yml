name: Verify Airia campaign screens
on:
  push:
    branches: [codex/airia-stage-01-v11198]
    paths: ['game/assets/main-campaign.js', 'qa/main-airia-browser.cjs', 'game/assets/main-airia-command-post.svg', '.github/workflows/airia-campaign-browser.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - run: |
          npm ci --no-audit --no-fund
          python3 tools/prepare_operation_music.py
          python3 tools/prepare_main_airia_assets.py
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          node qa/main-airia-browser.cjs
          node qa/main-campaign-intro-browser.cjs
          node qa/campaign-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airia-campaign-screen-checks
          path: qa/campaign-previews/
          if-no-files-found: ignore
