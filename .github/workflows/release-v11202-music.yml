name: Publish verified music deduplication APK v1.12.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v11202-music.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release-v11202
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_SOURCE: 409206424feeb9493d069938ceafc07798a19585
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve the already tested APK from the successful source build
        run: |
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/41987421576 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/41987421576 --jq .head_sha)" = "$BUILD_SOURCE"
          test "$(gh api repos/$GH_REPO/actions/artifacts/13396248922 --jq .workflow_run.id)" = 41987421576
          git merge-base --is-ancestor "$BUILD_SOURCE" "$GITHUB_SHA"
          # Only release automation and documentation may differ from tested code.
          git diff --exit-code "$BUILD_SOURCE" "$GITHUB_SHA" -- . ':!.github' ':!docs'
          gh run download 41987421576 --name Terha-Conquest-v1.12.2-music-dedup --dir deliverables
          cd deliverables
          sha256sum -c SHA256SUMS-v1.12.2.txt
          test "$(cat SOURCE_COMMIT)" = "$BUILD_SOURCE"
      - name: Recheck installed identity, original update certificate and measured size
        run: |
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.12.2.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.12.2.apk
          python3 - <<'PY'
          import json, pathlib
          apk = pathlib.Path('deliverables/Terha-Conquest-v1.12.2.apk')
          report = json.loads(pathlib.Path('deliverables/music-size-report.json').read_text())
          assert apk.stat().st_size == report['apkBytes'] == 323469406
          assert report['savedBytes'] == 30820982 and report['savedPercent'] == 8.7
          print('Verified original tested APK: 323,469,406 bytes; 30,820,982 bytes saved')
          PY
          cd deliverables
          sha256sum Terha-Conquest-v1.12.2.apk webp-conversion-report.json music-size-report.json SOURCE_COMMIT > SHA256SUMS-v1.12.2.txt
      - name: Upload verified assets to a draft, then publish the release
        run: |
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view v1.12.2 >/dev/null 2>&1; then
            test "$(gh release view v1.12.2 --json isDraft --jq .isDraft)" = true
          else
            gh release create v1.12.2 --draft --target "$GITHUB_SHA" --title '테르하 : 낙원의 기억 v1.12.2' --notes-file docs/releases/v1.12.2.md
          fi
          gh release upload v1.12.2 deliverables/Terha-Conquest-v1.12.2.apk deliverables/webp-conversion-report.json deliverables/music-size-report.json deliverables/SOURCE_COMMIT deliverables/SHA256SUMS-v1.12.2.txt --clobber
          gh release edit v1.12.2 --draft=false --latest
