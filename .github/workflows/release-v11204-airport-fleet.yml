name: Verify and release airport inventory APK v1.12.4
on:
  push:
    branches: [feat/airport-fleet]
    paths: ['.github/workflows/release-v11204-airport-fleet.yml', 'game/assets/airport-fleet.js', 'qa/airport-fleet-*.cjs']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: webp-v11204-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - name: Install remote lossless encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp python3-pil
          npm ci --no-audit --no-fund
      - name: Verify airport model and browser interactions before the full regression suite
        run: |
          python3 tools/prepare_operation_music.py
          python3 tools/prepare_main_airia_assets.py
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          node qa/airport-fleet-native.cjs
          node qa/airport-fleet-browser.cjs
      # Legacy command fixtures must inspect the active UI language.
      - name: Verify source gameplay and native shell
        run: |
          python3 tools/prepare_operation_music.py
          python3 tools/prepare_main_airia_assets.py
          npm test
          node qa/main-campaign-intro-native.cjs
          node qa/presentation-audio-regression.cjs
          python3 qa/verify-native.py
      - name: Convert all release PNGs on runner, compare every pixel and build signed APK
        run: |
          python3 build.py
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.12.4.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.12.4.apk
      - name: Verify actual WebP release bundle in Chromium
        env:
          TERHA_TEST_ROOT: ${{ github.workspace }}/android/build/webp
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          node qa/airport-fleet-browser.cjs
          node qa/hud-flags-browser.cjs
          node qa/main-airia-browser.cjs
          node qa/main-campaign-intro-browser.cjs
          node qa/campaign-browser.cjs
      - name: Record artifact checksums and source commit
        run: |
          echo "$GITHUB_SHA" > deliverables/SOURCE_COMMIT
          cd deliverables
          sha256sum Terha-Conquest-v1.12.4.apk webp-conversion-report.json SOURCE_COMMIT > SHA256SUMS-v1.12.4.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.12.4
          path: |
            deliverables/Terha-Conquest-v1.12.4.apk
            deliverables/webp-conversion-report.json
            deliverables/SOURCE_COMMIT
            deliverables/SHA256SUMS-v1.12.4.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WebP-browser-checks
          path: qa/campaign-previews/
          if-no-files-found: ignore
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve successfully verified artifact for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          run_id=$(gh run list --workflow release-v11204-airport-fleet.yml --branch feat/airport-fleet --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          gh run download "$run_id" --name Terha-Conquest-v1.12.4 --dir deliverables
          cd deliverables
          sha256sum -c SHA256SUMS-v1.12.4.txt
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
      - name: Verify release identity and original signing certificate
        run: |
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.12.4.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.12.4.apk
      - name: Publish main release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view v1.12.4 >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.12.4 --jq .object.sha)" = "$GITHUB_SHA"
            gh release upload v1.12.4 deliverables/Terha-Conquest-v1.12.4.apk deliverables/webp-conversion-report.json deliverables/SHA256SUMS-v1.12.4.txt --clobber
          else
            gh release create v1.12.4 deliverables/Terha-Conquest-v1.12.4.apk deliverables/webp-conversion-report.json deliverables/SHA256SUMS-v1.12.4.txt --target "$GITHUB_SHA" --title '테르하 : 낙원의 기억 v1.12.4 — 공항 항공기 재고' --notes-file docs/releases/v1.12.4.md
          fi
