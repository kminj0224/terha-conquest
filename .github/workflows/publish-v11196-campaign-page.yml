name: Verify and release campaign page v1.11.96
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v11196-campaign-page.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v11196
  cancel-in-progress: false
jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Install regression dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 tools/prepare_operation_music.py
      - name: Verify game, main campaign page, shared campaign and Android shell
        run: |
          node qa/main-campaign-intro-native.cjs
          npm test
          node qa/main-campaign-intro-browser.cjs
          node qa/campaign-picker-browser.cjs
          node qa/campaign-browser.cjs
          python3 qa/verify-native.py
      - name: Build signed update APK
        run: python3 build.py
      - name: Verify APK identity, original certificate and campaign page assets
        run: |
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.11.96.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.96.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('deliverables/Terha-Conquest-v1.11.96.apk') as z:
              for name in ['main-campaign.js','main-campaign.css','main-campaign-data.js','app-shell.js','saves.js']:
                  assert z.read('assets/'+name)==Path('game/assets',name).read_bytes(), name
              script=z.read('assets/main-campaign.js').decode()
              assert '<main class="mcStages"' in script
              assert 'data-stage-layout' not in script
              assert 'mcStagesClose' not in script
              assert 'role="dialog"' not in script
          print('PASS exact full-page campaign selector resources in signed APK')
          PY
          cd deliverables
          sha256sum Terha-Conquest-v1.11.96.apk > SHA256SUMS-v1.11.96.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-v11196-browser-screenshots
          path: qa/campaign-previews/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.11.96
          path: |
            deliverables/Terha-Conquest-v1.11.96.apk
            deliverables/SHA256SUMS-v1.11.96.txt
          if-no-files-found: error
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view v1.11.96 >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.11.96 --jq .object.sha)" = "$GITHUB_SHA"
            gh release upload v1.11.96 deliverables/Terha-Conquest-v1.11.96.apk deliverables/SHA256SUMS-v1.11.96.txt --clobber
          else
            gh release create v1.11.96 deliverables/Terha-Conquest-v1.11.96.apk deliverables/SHA256SUMS-v1.11.96.txt --target "$GITHUB_SHA" --title '테르하 : 낙원의 기억 v1.11.96' --notes-file docs/releases/v1.11.96.md
          fi
