name: Commit Generated v1.10.97 Neutral World Asset
on:
  push:
    paths:
      - '.github/workflows/commit-v11097-neutral-world.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-in-neutral-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate country-neutral world PNG using reproducible source script
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 tools/neutralize_world.py
          test -s game/assets/world-neutral.png
      - name: Commit render-ready neutral terrain to main
        run: |
          git add game/assets/world-neutral.png
          if git diff --cached --quiet; then
            echo "Neutral map is already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Check in neutral world terrain for owner-only territory coloring'
          git push origin HEAD:main
