name: Verify and publish main campaign prologue v1.11.79
on:
  push:
    branches: [main, codex/main-campaign-prologue]
    paths: ['.github/workflows/publish-v11179-main-intro.yml', 'game/assets/main-campaign*', 'qa/main-campaign-intro-browser.cjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-intro-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify prologue, campaign picker and shared campaign engine
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 tools/prepare_operation_music.py
          node qa/main-campaign-intro-native.cjs
          node qa/main-campaign-intro-browser.cjs
          node qa/campaign-picker-browser.cjs
          node qa/campaign-browser.cjs
          python3 qa/verify-native.py
      - name: Build and verify original update certificate
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.79.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.79.apk > SHA256SUMS-v1.11.79.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-prologue-review-${{ github.sha }}
          path: |
            qa/campaign-previews/main-*.png
            deliverables/Terha-Conquest-v1.11.79.apk
          if-no-files-found: ignore
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.79 >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.11.79 --jq .object.sha)" = "$GITHUB_SHA"
            gh release upload v1.11.79 deliverables/Terha-Conquest-v1.11.79.apk deliverables/SHA256SUMS-v1.11.79.txt --clobber
          else
            gh release create v1.11.79 deliverables/Terha-Conquest-v1.11.79.apk deliverables/SHA256SUMS-v1.11.79.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.79 — 메인 캠페인 서막' --notes-file docs/releases/v1.11.79.md
          fi
