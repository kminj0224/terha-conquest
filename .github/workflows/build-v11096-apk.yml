name: Build Terha Conquest v1.10.96 Restored Territory Colors Update
on:
  push:
    paths:
      - '.github/workflows/build-v11096-apk.yml'
      - 'build.py'
      - 'game/assets/app-shell.js'
      - 'game/assets/saves.js'
      - 'qa/ranna-regression.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify HUD and compact city UI scripts are packaged
        run: |
          test -s game/assets/fuel-efficiency-icon.webp
          test -s game/assets/v11083-unit-nameplates.js
          grep -q 'v11083-unit-nameplates.js' game/assets/index.html
          grep -q 'v11085-command-ui.js' game/assets/index.html
          grep -q 'v11085-strategic.js' game/assets/index.html
          grep -q 'v11086-ui-polish.js' game/assets/index.html
          grep -q 'v11088-city-ui.js' game/assets/index.html
          grep -q 'v11091-gameplay-fixes.js' game/assets/index.html
          grep -q 'dante-fleet-art.js' game/assets/index.html
          test -s game/assets/dante-carrier.webp
          test -s game/assets/dante-destroyer.webp
          test -s game/assets/dante-frigate.webp
      - name: Install game test dependencies
        run: npm ci --no-audit --no-fund
      - name: Full gameplay and Dante fleet regressions with restored v1.10.91 territory colors
        run: node qa/native-test.cjs
      - name: Verify Android native wrapper
        run: python3 qa/verify-native.py
      - name: Build signed v1.10.96 update APK
        run: python3 build.py
      - name: Verify installable package version, Android build number and retained DEX
        run: |
          python3 - <<'PY'
          import zipfile, struct
          with zipfile.ZipFile('deliverables/Terha-Conquest-v1.10.96.apk') as z:
              manifest=z.read('AndroidManifest.xml')
              dex=z.read('classes.dex')
          with zipfile.ZipFile('android/native-shell.zip') as z:
              assert dex==z.read('classes.dex'), 'Native package changed unexpectedly'
          strs=[]; codes=[]; off=8
          while off<len(manifest):
              kind,head,size=struct.unpack_from('<HHI',manifest,off)
              assert size>0
              if kind==1:
                  count,_,flags,start,_=struct.unpack_from('<IIIII',manifest,off+8)
                  assert not flags&0x100
                  for j in range(count):
                      idx=struct.unpack_from('<I',manifest,off+head+4*j)[0]
                      pos=off+start+idx
                      n=struct.unpack_from('<H',manifest,pos)[0]
                      strs.append(manifest[pos+2:pos+2+n*2].decode('utf-16le'))
              if kind==0x102:
                  begin,item_size,count=struct.unpack_from('<HHH',manifest,off+24)
                  for j in range(count):
                      pos=off+16+begin+j*item_size
                      key=strs[struct.unpack_from('<I',manifest,pos+4)[0]]
                      if key=='versionCode':
                          assert manifest[pos+15]==0x10
                          codes.append(struct.unpack_from('<I',manifest,pos+16)[0])
              off+=size
          assert codes==[140],f'Wrong Android versionCode: {codes}'
          assert '1.10.96' in strs and '1.10.65' not in strs,'Wrong Android versionName'
          print('PASS: Android versionName 1.10.96, versionCode 140, native package DEX unchanged')
          PY
      - name: Verify original signing certificate and SHA256
        run: |
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.10.96.apk
          sha256sum deliverables/Terha-Conquest-v1.10.96.apk > deliverables/SHA256SUMS.txt
      - name: Split verified APK into transport-safe pieces
        run: |
          mkdir -p deliverables/parts
          split -b 90m -d -a 2 deliverables/Terha-Conquest-v1.10.96.apk deliverables/parts/Terha-Conquest-v1.10.96.apk.part
          test -s deliverables/parts/Terha-Conquest-v1.10.96.apk.part00
          test -s deliverables/parts/Terha-Conquest-v1.10.96.apk.part01
          test -s deliverables/parts/Terha-Conquest-v1.10.96.apk.part02
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-v11096-part00
          path: deliverables/parts/Terha-Conquest-v1.10.96.apk.part00
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-v11096-part01
          path: deliverables/parts/Terha-Conquest-v1.10.96.apk.part01
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-v11096-part02
          path: deliverables/parts/Terha-Conquest-v1.10.96.apk.part02
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-v11096-SHA256
          path: deliverables/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
