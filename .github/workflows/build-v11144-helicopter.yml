name: Bridge fixes and attack helicopter v1.11.44 APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/build-v11144-helicopter.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Set up FFmpeg and FFprobe
        uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify real bridge interactions and Sapros
        run: |
          python3 tools/prepare_operation_music.py
          node qa/fixes-v11144-native.cjs
          node qa/sapros-native-regression.cjs
          node qa/sapros-regression.cjs
          node qa/supply-routes-regression.cjs
      - name: Verify full game and native shell
        run: |
          npm test
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.44.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.44.apk > SHA256SUMS.txt
      - name: Publish APK and preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.44 deliverables/Terha-Conquest-v1.11.44.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.44 · 교각 수정·백양 공격헬기' --notes '교각 위 해군이 있으면 연결 금지, 새 게임 및 기존 저장의 열린 교각 위 함정 해상 재배치, 백양 AI 교각 조작을 백양 차례로 제한. 사프로스 혈흔·스파크를 피격 유닛 앞의 깊이 순서로 렌더링. 제공 원화 4종을 사용한 백양 공격헬기 0.2초 방향별 로터 프레임과 8발 시차 로켓 공격. 전체 게임 회귀·실제 Canvas/DOM·기존 Android 업데이트 서명 검증 완료.'
