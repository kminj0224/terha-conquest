name: Build v1.11.20 ocean world
on:
  push:
    branches: [main, codex/v11120-ocean]
    paths:
      - 'game/assets/**'
      - 'qa/ocean-world-regression.cjs'
      - '.github/workflows/build-v11120-ocean.yml'
      - 'build.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Regression checks
        run: |
          mkdir -p previews
          node qa/mountain-tile-alignment.cjs
          node qa/ocean-world-regression.cjs
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then npm test; fi
          python3 qa/verify-native.py
      - name: Build signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.20.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.20.apk > SHA256SUMS.txt
      - name: Render review sheet
        run: |
          node - <<'JS'
          const fs=require('fs'),{createCanvas,loadImage}=require('@napi-rs/canvas');
          (async()=>{const names=['world','left','right','top','bottom','seam'],c=createCanvas(1440,660),g=c.getContext('2d');g.fillStyle='#132d38';g.fillRect(0,0,c.width,c.height);for(let n=0;n<names.length;n++){const x=n%3*480,y=Math.floor(n/3)*330;g.drawImage(await loadImage('previews/ocean-'+names[n]+'.png'),x,y+30,480,300);g.fillStyle='#ffffff';g.font='18px sans-serif';g.fillText(names[n],x+12,y+22)}console.log('OCEAN_REVIEW_JPEG_BASE64='+c.toBuffer('image/jpeg',80).toString('base64'))})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: Terha-Conquest-v1.11.20
          path: |
            deliverables/*
            previews/ocean-*.png
          retention-days: 7
      - name: Publish verified APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.20 deliverables/Terha-Conquest-v1.11.20.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.20 — Ocean World' --notes 'Enlarge every city tier by 15%, retain one carrier and one frigate in the northern Baek–Dante frontline group, add navigable illustrated ocean around the retained map, and connect the east/west edges for continuous scrolling and naval movement. Existing campaigns remain loadable; starting fleet changes apply to new campaigns. Android versionCode 165; original update signing identity retained.'
