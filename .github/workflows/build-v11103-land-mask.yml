name: Build Terha Conquest v1.11.3 — Correct Land Water Mask
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v11103-painted-world.yml'
      - 'tools/repaint-terha-world.cjs'
      - 'game/assets/map.json'
      - 'qa/land-water-art-regression.cjs'
      - 'game/assets/game.js'
      - 'game/assets/coast-art.js'
      - 'game/assets/static-ground.js'
      - 'build.py'
      - 'game/assets/app-shell.js'
      - 'game/assets/saves.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paint-test-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install canvas dependencies
        run: npm ci --no-audit --no-fund
      - name: Repaint entire original geographical raster
        run: node tools/repaint-terha-world.cjs
      - name: Upload full-world map preview
        uses: actions/upload-artifact@v4
        with:
          name: terha-v11103-painted-world-preview
          path: |
            game/assets/world-painted-preview.jpg
            game/assets/world-painted-shore-test.png
          retention-days: 30
      - name: Verify national land pigments were preserved
        run: node qa/land-water-art-regression.cjs
      - name: Verify no old glowing coastline is drawn
        run: |
          node - <<'JS'
          const fs=require('fs');
          const game=fs.readFileSync('game/assets/game.js','utf8');
          const coast=fs.readFileSync('game/assets/coast-art.js','utf8');
          const png=fs.readFileSync('game/assets/world-painted.png');
          if(!game.includes("worldImg.src='world-painted.png'") || coast.includes("src='coast-overlay.png'"))throw Error('Old coastline overlay still active');
          if(png.length<2_000_000 || !png.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])))throw Error('Baked world art absent');
          console.log('PASS: Repainted main world raster');
          JS
      - name: Run full native Canvas regression suite
        run: npm test
      - name: Verify unchanged Android shell
        run: python3 qa/verify-native.py
      - name: Build signed Android v1.11.3
        run: python3 build.py
      - name: Verify repainted world and signed APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct
          apk=Path('deliverables/Terha-Conquest-v1.11.3.apk')
          assert apk.is_file() and apk.stat().st_size>30_000_000
          with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
            assert len(z.read('assets/world-painted.png'))>2_000_000
            assert b"world-painted.png" in z.read('assets/game.js')
            xml=z.read('AndroidManifest.xml')
          off=8;strings=[];codes=[]
          while off<len(xml):
            kind,head,size=struct.unpack_from('<HHI',xml,off)
            assert size>0
            if kind==1:
              count,_,flags,start,_=struct.unpack_from('<IIIII',xml,off+8)
              assert not flags&0x100
              for j in range(count):
                q=off+start+struct.unpack_from('<I',xml,off+head+4*j)[0]
                n=struct.unpack_from('<H',xml,q)[0]
                strings.append(xml[q+2:q+2+2*n].decode('utf-16le'))
            if kind==0x102:
              begin,sz,count=struct.unpack_from('<HHH',xml,off+24)
              for j in range(count):
                q=off+16+begin+j*sz
                key=strings[struct.unpack_from('<I',xml,q+4)[0]]
                if key=='versionCode':codes.append(struct.unpack_from('<I',xml,q+16)[0])
            off+=size
          assert codes==[148],codes
          assert '1.11.2' in strings
          print('PASS art in signed APK v1.11.3 build 148')
          PY
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.3.apk
          cd deliverables && sha256sum Terha-Conquest-v1.11.3.apk > SHA256SUMS.txt
      - name: Commit the actual full world painting PNG to main
        run: |
          git config user.name "terha-map-art-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f game/assets/world-painted.png
          if ! git diff --cached --quiet; then
            git commit -m "Preserve all nation land pigments using map tile geometry while painting offshore surf"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.11.3-painted-world-apk
          path: |
            deliverables/Terha-Conquest-v1.11.3.apk
            deliverables/SHA256SUMS.txt
          retention-days: 30
          compression-level: 0
      - name: Publish signed APK and map preview on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.11.3
          apk=deliverables/Terha-Conquest-v1.11.3.apk
          sums=deliverables/SHA256SUMS.txt
          preview=game/assets/world-painted-preview.jpg
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$sums" "$preview" --clobber
          else
            gh release create "$tag" "$apk" "$sums" "$preview" --target main --title "Terha Conquest v1.11.3 — Restored National Land" --notes "Fixes water-like land colors in Cielrun, Stetopia and Nakwol. World map generator uses original 112x84 authoritative terrain grid to protect 100% of land tile pigment while repainting the sea. Original game geography, rivers, APK signing and saves preserved."
          fi
          gh release view "$tag" --json url,assets
