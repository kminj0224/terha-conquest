name: Build v1.10.72 compact operation overview
on:
  push:
    paths:
      - '.github/workflows/rebuild-v11072.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recompile native shell
        run: python3 tools/build_native_shell.py
      - name: Verify Android DEX
        run: python3 qa/verify-native.py
      - name: Test retained live session across Home and Activity recreation
        run: python3 qa/test-live-session.py
      - name: Build signed APK
        run: python3 build.py
      - name: Verify original signing certificate
        run: |
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.10.72.apk
          sha256sum deliverables/Terha-Conquest-v1.10.72.apk > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.10.72
          path: |
            deliverables/Terha-Conquest-v1.10.72.apk
            deliverables/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
