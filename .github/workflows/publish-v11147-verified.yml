name: Publish verified v1.11.47 APK directly to Release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v11147-verified.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the exact source that passed all tests in run 40305079279
        run: |
          git diff --exit-code 5d39050e8fa9663dc0933cb4e1a2492ab9bfc220 HEAD -- game/assets qa build.py android tools package.json package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Build and verify signed Android update
        run: |
          python3 qa/verify-native.py
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.47.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.47.apk > SHA256SUMS.txt
      - name: Publish permanent release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.47 deliverables/Terha-Conquest-v1.11.47.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.47' --notes '유닛 설명 중복 제거, 유닛·반격 밸런스 조정, 국가 공통 연비 개선과 수송로 개선, 전 국가 AI 생산 검사 및 다양성 개선, 무료 수송선 지급 한도 축소. versionCode 192. 전체 테스트 통과 및 기존 업데이트 서명 유지. Actions 임시 산출물 저장 한도와 별도로 정식 Release에 직접 게시.'
