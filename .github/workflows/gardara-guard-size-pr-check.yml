name: Verify Gardara elite compact sprite and muzzle alignment
on:
  pull_request:
    branches: [main]
    paths:
      - 'game/assets/gardara.js'
      - 'game/assets/rifle-art.js'
      - 'qa/gardara-special-art-native.cjs'
      - '.github/workflows/gardara-guard-size-pr-check.yml'
permissions:
  contents: read
jobs:
  visual-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare audio fixtures
        run: python3 tools/prepare_operation_music.py
      - name: Verify guard size and all four muzzle effects
        run: node qa/gardara-special-art-native.cjs
