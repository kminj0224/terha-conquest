name: Slots and armored cars v1.11.49 APK
on:
  push:
    branches: [main, codex/slots-apc-v11149]
    paths: ['game/assets/**', 'qa/**', 'build.py', '.github/workflows/build-v11149-slots-armor.yml']
permissions:
  contents: write
jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: github.ref != 'refs/heads/main'
        run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify save migration, artwork, game and Android shell
        if: github.ref != 'refs/heads/main'
        run: |
          python3 tools/prepare_operation_music.py
          npm test
          node qa/white-night-native.cjs
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.49.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.49.apk > SHA256SUMS.txt
      - name: Publish APK after main integration
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.49 deliverables/Terha-Conquest-v1.11.49.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.49' --notes '수동 저장슬롯 10개(자동 저장 별도), 메카닉 나이트 기본 HP 512와 기존 체력 비율 유지, 낙월 특공대 발 위치 조정, 국가별 경전차 차체 기반 기관포 장갑차 이미지. Android versionCode 194, 기존 업데이트 인증서 유지.'
      - name: Prepare authenticated APK transfer
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export APK_ASSET_API=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/v1.11.49 --jq '.assets[] | select(.name=="Terha-Conquest-v1.11.49.apk") | .url')
          python3 - <<'PYTRANSFER'
          import os, urllib.request
          request=urllib.request.Request(os.environ['APK_ASSET_API'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream','User-Agent':'Terha-Conquest-build'})
          with urllib.request.urlopen(request) as response:
              url=response.geturl()
              assert 'release-assets.githubusercontent.com' in url
              print('APK_TRANSFER_URL='+url)
          PYTRANSFER

