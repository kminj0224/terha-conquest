name: Build Terha Conquest v1.10.83 Unit Nameplates
on:
  push:
    paths:
      - '.github/workflows/build-v11083-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify original user-provided leaf badge and HUD code are packaged
        run: |
          test -s game/assets/fuel-efficiency-icon.webp
          test -s game/assets/v11083-unit-nameplates.js
          grep -q 'v11083-unit-nameplates.js' game/assets/index.html
      - name: Install game test dependencies
        run: npm ci --no-audit --no-fund
      - name: Full gameplay regression suite and on-screen label layering
        run: node qa/native-test.cjs
      - name: Verify Android native wrapper
        run: python3 qa/verify-native.py
      - name: Build signed v1.10.83 APK
        run: python3 build.py
      - name: Verify original signing certificate and SHA256
        run: |
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.10.83.apk
          sha256sum deliverables/Terha-Conquest-v1.10.83.apk > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.10.83
          path: |
            deliverables/Terha-Conquest-v1.10.83.apk
            deliverables/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
