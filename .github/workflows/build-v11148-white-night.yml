name: White Night and research fixes v1.11.48 APK
on:
  push:
    branches: [main, codex/white-night-v11148]
    paths: ['game/assets/**', 'qa/**', 'build.py', '.github/workflows/build-v11148-white-night.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify final research UI, White Night sweep/artwork/AI and ground corpses
        run: |
          python3 tools/prepare_operation_music.py
          node qa/white-night-native.cjs
          node qa/sapros-regression.cjs
          node qa/supply-network-regression.cjs
          node qa/siege-occupation-regression.cjs
      - name: Verify full game and retained Android shell
        run: |
          npm test
          python3 qa/verify-native.py
      - name: Build signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.48.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.48.apk > SHA256SUMS.txt
      - name: Publish permanent release assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.48 deliverables/Terha-Conquest-v1.11.48.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.48' --notes '연비 개선 중복 버튼 제거 및 연구별 실제 효과 정보 표시. 시엘룬 특수 보병 백야의 밤 추가: 사거리 1, 전방 최대 8칸, 직격 100·추가 60, 사프로스와 같은 공격 타이밍 및 개별 피격 효과. 모든 시체와 잔해를 살아 있는 유닛 아래 지면에서 표시. versionCode 193, 기존 업데이트 인증서 유지.'
