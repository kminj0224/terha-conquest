name: Build v1.11.32 motorized infantry APK
on:
  push:
    branches: [main, codex/motorized-infantry]
    paths:
      - 'game/assets/*motorized*'
      - 'qa/motorized-art-regression.cjs'
      - 'qa/ranna-regression.cjs'
      - 'qa/native-test.cjs'
      - 'build.py'
      - '.github/workflows/build-v11132-motorized.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run native Canvas and motorized infantry regression checks
        run: |
          python3 tools/prepare_operation_music.py
          node qa/ayria-infantry-regression.cjs
          node qa/ayria-desert-regression.cjs
          npm test
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.32.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.32.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Terha-Conquest-v1.11.32
          path: |
            deliverables/Terha-Conquest-v1.11.32.apk
            deliverables/SHA256SUMS.txt
          retention-days: 14
      - name: Publish signed APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.32 deliverables/Terha-Conquest-v1.11.32.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.32' --notes 'Motorized infantry use armored carriers when idle or moving and national rifle squads while firing eight-round bursts with heavy-machine-gun audio. Baekyang uses the supplied left/right APC art; other nations use turretless light-tank hulls. Save IDs, unit statistics and Android signing identity are preserved. versionCode 177.'
