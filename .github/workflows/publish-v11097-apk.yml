name: Publish Terha Conquest v1.10.97 APK
on:
  push:
    paths:
      - '.github/workflows/publish-v11097-apk.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify signed v1.10.97 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables sums
          for n in 00 01 02; do
            mkdir -p "parts/${n}"
            gh run download 39206133725 --name "Terha-v11097-part${n}" --dir "parts/${n}"
          done
          gh run download 39206133725 --name Terha-v11097-SHA256 --dir sums
          for n in 00 01 02; do
            cat "parts/${n}/Terha-Conquest-v1.10.97.apk.part${n}" >> deliverables/Terha-Conquest-v1.10.97.apk
          done
          sha256sum -c sums/SHA256SUMS.txt
          test -s deliverables/Terha-Conquest-v1.10.97.apk
      - name: Publish original-signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.97 >/dev/null 2>&1; then
            gh release upload v1.10.97 deliverables/Terha-Conquest-v1.10.97.apk sums/SHA256SUMS.txt --clobber
          else
            gh release create v1.10.97 deliverables/Terha-Conquest-v1.10.97.apk sums/SHA256SUMS.txt --target 6f5862c63788379049ebd68d9296b8d13db3ebf9 --title "Terha Conquest v1.10.97" --notes "Neutral world plains rebuilt offline from original map while retaining sea colors and terrain relief. Territory colors now derive exclusively from the current occupying country, including captured regions. Mountain/forest baked detail and all game systems retained. Signed with original Android update certificate; versionCode 141. Regression tested."
          fi
          gh release view v1.10.97 --json url,assets
