name: Check In v1.10.99 Painted Map Assets
on:
  push:
    paths:
      - '.github/workflows/commit-v11099-painted-world.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  painted-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Paint natural biomes and seamless coastline textures
        run: |
          python3 -m pip install --quiet pillow numpy scipy
          python3 tools/paint_world_atlas.py
          test -s game/assets/world-natural-coast.png
          test -s game/assets/coast-natural-overlay.png
          test -s game/assets/coast-land-mask.png
          test -s game/assets/world-surface-detail.png
      - name: Check in complete painted game-map layers
        run: |
          git add game/assets/world-natural-coast.png game/assets/coast-natural-overlay.png game/assets/coast-land-mask.png game/assets/world-surface-detail.png
          if git diff --cached --quiet; then
            echo "Painted world assets already up-to-date"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bake v1.10.99 painterly biomes, land relief and ocean into full-resolution PNGs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Could not fast-forward painted atlas to main" >&2
          exit 1
