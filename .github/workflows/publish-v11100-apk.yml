name: Publish Terha Conquest v1.11.0 Rollback APK
on:
  workflow_run:
    workflows:
      - Build Terha Conquest v1.11.0 Exact v1.10.91 Rollback
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reassemble verified 1.11.0 signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables sums
          for n in 00 01 02; do
            mkdir -p "parts/${n}"
            gh run download "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --name "Terha-v11100-part${n}" --dir "parts/${n}"
          done
          gh run download "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --name Terha-v11100-SHA256 --dir sums
          for n in 00 01 02; do
            cat "parts/${n}/Terha-Conquest-v1.11.0.apk.part${n}" >> deliverables/Terha-Conquest-v1.11.0.apk
          done
          sha256sum -c sums/SHA256SUMS.txt
          test -s deliverables/Terha-Conquest-v1.11.0.apk
      - name: Publish directly downloadable APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.0 >/dev/null 2>&1; then
            gh release upload v1.11.0 deliverables/Terha-Conquest-v1.11.0.apk sums/SHA256SUMS.txt --clobber
          else
            gh release create v1.11.0 deliverables/Terha-Conquest-v1.11.0.apk sums/SHA256SUMS.txt --target "${{ github.event.workflow_run.head_sha }}" --title "Terha Conquest v1.11.0 (v1.10.91 Rollback)" --notes "Exactly restores v1.10.91 gameplay, maps, assets and UI. Only the app version and Android update code changed: versionName 1.11.0 and versionCode 144. Original signing certificate retained. Newer map experiments and gameplay additions have been removed. Full original game regression verified."
          fi
          gh release view v1.11.0 --json url,assets
