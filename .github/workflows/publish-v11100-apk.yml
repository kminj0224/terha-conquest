name: Publish Terha Conquest v1.11.0 Rollback APK
on:
  workflow_run:
    workflows:
      - Build Terha Conquest v1.11.0 Exact v1.10.94 Rollback
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reassemble verified 1.11.0 signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables sums
          for n in 00 01 02; do
            mkdir -p "parts/${n}"
            gh run download "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --name "Terha-v11100-part${n}" --dir "parts/${n}"
          done
          gh run download "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --name Terha-v11100-SHA256 --dir sums
          for n in 00 01 02; do
            cat "parts/${n}/Terha-Conquest-v1.11.0.apk.part${n}" >> deliverables/Terha-Conquest-v1.11.0.apk
          done
          sha256sum -c sums/SHA256SUMS.txt
          test -s deliverables/Terha-Conquest-v1.11.0.apk
      - name: Publish directly downloadable APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.0 >/dev/null 2>&1; then
            gh release upload v1.11.0 deliverables/Terha-Conquest-v1.11.0.apk sums/SHA256SUMS.txt --clobber
            gh release edit v1.11.0 --title 'Terha Conquest v1.11.0 (v1.10.94 Rollback)' --notes 'Exactly restores v1.10.94 gameplay, maps, artwork, city and naval units, and interface. The previous v1.11.0 build based on v1.10.91 is replaced. Only the app version, Android versionCode 145 and release tooling differ. Original Android signing certificate retained and regression-tested.'
          else
            gh release create v1.11.0 deliverables/Terha-Conquest-v1.11.0.apk sums/SHA256SUMS.txt --target "${{ github.event.workflow_run.head_sha }}" --title "Terha Conquest v1.11.0 (v1.10.94 Rollback)" --notes "Exactly restores v1.10.94 gameplay, maps, artwork, city and naval units, and interface. The previous v1.11.0 build based on v1.10.91 is replaced. Only the app version, Android versionCode 145 and release tooling differ. Original Android signing certificate retained and regression-tested."
          fi
          # Keep the v1.11.0 tag at the newly restored original-v1.10.94 tree.
          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/v1.11.0" -f sha="${{ github.event.workflow_run.head_sha }}" -F force=true
          gh release view v1.11.0 --json url,assets
