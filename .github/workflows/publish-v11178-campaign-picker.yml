name: Publish campaign branch picker v1.11.78 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v11178-campaign-picker.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v11178
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify campaign navigation and shared campaign engine in Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 tools/prepare_operation_music.py
          node qa/campaign-picker-browser.cjs
          node qa/campaign-browser.cjs
          python3 qa/verify-native.py
      - name: Build and verify original update certificate
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.78.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.78.apk > SHA256SUMS-v1.11.78.txt
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.78 >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.11.78 --jq .object.sha)" = "$GITHUB_SHA"
            gh release upload v1.11.78 deliverables/Terha-Conquest-v1.11.78.apk deliverables/SHA256SUMS-v1.11.78.txt --clobber
          else
            gh release create v1.11.78 deliverables/Terha-Conquest-v1.11.78.apk deliverables/SHA256SUMS-v1.11.78.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.78 — 메인·서브 캠페인 선택창' --notes-file docs/releases/v1.11.78.md
          fi
          gh release view v1.11.78 --json url,assets
