name: Connected coastal occupation supply v1.11.46 APK
on:
  push:
    branches: [main, codex/supply-network]
    paths: ['game/assets/**', 'qa/**', 'build.py', '.github/workflows/build-v11146-supply-network.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Set up FFmpeg and FFprobe
        uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify real bridge interactions and Sapros
        run: |
          python3 tools/prepare_operation_music.py
          node qa/fixes-v11144-native.cjs
          node qa/sapros-native-regression.cjs
          node qa/sapros-regression.cjs
          node qa/supply-routes-regression.cjs
          node qa/supply-network-regression.cjs
          node qa/siege-occupation-regression.cjs
      - name: Verify full game and native shell
        run: |
          npm test
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.46.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.46.apk > SHA256SUMS.txt
      - name: Publish APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.46 deliverables/Terha-Conquest-v1.11.46.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.46' --notes '본토·점령지 양쪽의 아군 통제 육지와 연결된 바다로 수송 경로 통일. 고립 본토 출발 차단, 적지 경유 차단, 경로 단절 시 대기·복구 후 재개, AI·저장 호환. 공격헬기 전 국가 기체 30% 확대 및 발사 위치 정렬. versionCode 191.'


