name: Publish Terha Conquest v1.10.96 Direct APK
on:
  workflow_run:
    workflows:
      - Build Terha Conquest v1.10.96 Restored Territory Colors Update
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble signed APK from successful v1.10.96 build and verify checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables sums
          for n in 00 01 02; do
            mkdir -p "parts/${n}"
            gh run download 39201838063 --name "Terha-v11096-part${n}" --dir "parts/${n}"
          done
          gh run download 39201838063 --name Terha-v11096-SHA256 --dir sums
          for n in 00 01 02; do
            cat "parts/${n}/Terha-Conquest-v1.10.96.apk.part${n}" >> deliverables/Terha-Conquest-v1.10.96.apk
          done
          sha256sum -c sums/SHA256SUMS.txt
          test -s deliverables/Terha-Conquest-v1.10.96.apk
      - name: Publish update APK with original signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.96 >/dev/null 2>&1; then
            gh release upload v1.10.96 deliverables/Terha-Conquest-v1.10.96.apk sums/SHA256SUMS.txt --clobber
          else
            gh release create v1.10.96 deliverables/Terha-Conquest-v1.10.96.apk sums/SHA256SUMS.txt --target b51c2736636da0700e7c3b052e8c51114245b35d --title "Terha Conquest v1.10.96" --notes "Signed Android update APK. Original v1.10.94 rollback game and v1.10.91 territory rendering retained exactly; only app version increased to 1.10.96 (versionCode 140) to install over v1.10.95 (139). Original signing certificate, native package and gameplay tests verified."
          fi
          gh release view v1.10.96 --json url,assets
