name: Verify compact campaign rating flow
on:
  push:
    branches: [codex/campaign-compact63]
permissions:
  contents: read
jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - name: Verify native campaign flow and restrictions
        run: |
          python3 tools/prepare_operation_music.py
          node qa/campaign-rules-simulation.cjs
          node qa/campaign-defense-status-simulation.cjs
          node qa/campaign-orders-simulation.cjs
          node qa/campaign-no-navy-simulation.cjs
          python3 qa/verify-native.py
      - name: Verify compact cards and shared UI in Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install --with-deps chromium
          node qa/campaign-compact-browser.cjs
          node qa/campaign-defense-status-browser.cjs
          node qa/campaign-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Compact-campaign-review
          path: qa/campaign-previews/*
  native-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - run: |
          python3 tools/prepare_operation_music.py
          npm test
