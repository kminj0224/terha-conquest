name: Publish conquest AI v1.11.75 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v11175-conquest-ai.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v11175
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ffcb06a4d6eddac9801319850fd638bed8bbe6bc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify conquest AI, supply routes, native shell and build APK
        run: |
          npm ci --no-audit --no-fund
          python3 tools/prepare_operation_music.py
          node qa/conquest-ai-simulation.cjs
          node qa/supply-network-regression.cjs
          node qa/supply-routes-regression.cjs
          python3 qa/verify-native.py
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.75.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.75.apk > SHA256SUMS-v1.11.75.txt
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.75 >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.11.75 --jq .object.sha)" = ffcb06a4d6eddac9801319850fd638bed8bbe6bc
            gh release upload v1.11.75 deliverables/Terha-Conquest-v1.11.75.apk deliverables/SHA256SUMS-v1.11.75.txt --clobber
          else
            gh release create v1.11.75 deliverables/Terha-Conquest-v1.11.75.apk deliverables/SHA256SUMS-v1.11.75.txt --target ffcb06a4d6eddac9801319850fd638bed8bbe6bc --title 'Terha Conquest v1.11.75 — 정복 AI 난이도·공수 점령·천제호 수송로' --notes-file docs/releases/v1.11.75.md
          fi
          gh release view v1.11.75 --json url,assets
