name: Build v1.11.33 occupation supply APK
on:
  push:
    branches: [main, codex/occupation-supply]
    paths:
      - 'game/assets/occupation-supply.js'
      - 'qa/occupation-supply-regression.cjs'
      - '.github/workflows/build-v11133-occupation-supply.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run game and native shell regression checks
        run: |
          python3 tools/prepare_operation_music.py
          npm test
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.33.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.33.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Terha-Conquest-v1.11.33
          path: |
            deliverables/Terha-Conquest-v1.11.33.apk
            deliverables/SHA256SUMS.txt
          retention-days: 14
      - name: Publish signed APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.33 deliverables/Terha-Conquest-v1.11.33.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.33' --notes '점령도시 병력은 점령도시 이하 레벨의 아군 본토 도시에서 훈련해 육로 2턴 / 해상 3턴 후 도착합니다. 병종과 남은 턴을 표시하며, 보급은 자원이 있는 한 같은 턴에 반복 가능합니다. versionCode 178.'
