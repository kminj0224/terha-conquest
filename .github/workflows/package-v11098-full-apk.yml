name: Package v1.10.98 Single APK Artifact
on:
  workflow_run:
    workflows:
      - Build Terha Conquest v1.10.98 Organic Coastline (Hex Logic Kept)
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
jobs:
  deliver:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reconstruct original-signed APK from verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables sums
          for n in 00 01 02; do
            mkdir -p "parts/${n}"
            gh run download "${{ github.event.workflow_run.id || 39210268034 }}" --repo "${{ github.repository }}" --name "Terha-v11098-part${n}" --dir "parts/${n}"
          done
          gh run download "${{ github.event.workflow_run.id || 39210268034 }}" --repo "${{ github.repository }}" --name Terha-v11098-SHA256 --dir sums
          for n in 00 01 02; do
            cat "parts/${n}/Terha-Conquest-v1.10.98.apk.part${n}" >> deliverables/Terha-Conquest-v1.10.98.apk
          done
          sha256sum -c sums/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.10.98-complete-APK
          path: deliverables/Terha-Conquest-v1.10.98.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
