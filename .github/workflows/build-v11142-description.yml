name: Build v1.11.42 Sapros description APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-v11142-description.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify description and unchanged unit behavior
        run: |
          node --check game/assets/sapros.js
          node qa/sapros-regression.cjs
      - name: Build signed update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.42.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.42.apk > SHA256SUMS.txt
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.42 deliverables/Terha-Conquest-v1.11.42.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.42' --notes '사프로스 설명란에서 중복되는 기본 능력치와 식량 비용 문구 삭제. 실제 능력치와 생산 비용은 그대로 유지. versionCode 187.'
