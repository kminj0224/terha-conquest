name: Build v1.11.25 special support and mortar tuning
on:
  push:
    branches: [main]
    paths:
      - 'game/assets/special-auras.js'
      - '.github/workflows/build-v11125-support.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Mortar and dynamic special support regression checks
        run: |
          node - <<'JS'
          const fs=require('fs'),source=fs.readFileSync('qa/native-test.cjs','utf8'),cut=source.indexOf("\nassert.equal(run('appScreen'),'title')");
          if(cut<0)throw Error('Native harness boundary missing');
          fs.writeFileSync('qa/.focused-special.cjs',source.slice(0,cut)+"\n(async()=>{await Promise.all(pending);await require('./mortar-art-regression.cjs')({run});await require('./special-auras-regression.cjs')({run});process.exit(0)})().catch(e=>{console.error(e);process.exit(1)});");
          JS
          node qa/.focused-special.cjs
          rm qa/.focused-special.cjs
      - name: Native renderer and gameplay regression checks
        run: |
          mkdir -p previews
          npm test
          node qa/mountain-tile-alignment.cjs
          node qa/ocean-world-regression.cjs
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.25.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.25.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: Terha-Conquest-v1.11.25
          path: |
            deliverables/*
            previews/mortar-art-*.png
          retention-days: 14
      - name: Publish verified APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.25 deliverables/Terha-Conquest-v1.11.25.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.25 — Special Support' --notes 'Reduce stationary mortar crew artwork by 20 percent and match mortar travel duration to towed artillery (950 ms player, 650 ms AI). Add live two-tile same-faction special support: Dante commandos grant armor branch attack +50 percent, Black Legion reduces infantry incoming attack damage by 60 percent, Mecha Knights double armor branch armor. Effects do not stack and end outside range or when the source is dead or transported. Preserve save compatibility and original Android update signature. versionCode 170.'
