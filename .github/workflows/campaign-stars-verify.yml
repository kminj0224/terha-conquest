name: Verify illustrated terrain and common campaign ratings
on:
  push:
    branches: [codex/campaign-stars60]
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - run: |
          python3 tools/prepare_operation_music.py
          node qa/campaign-rules-simulation.cjs
          node qa/campaign-orders-simulation.cjs
          npm install --no-save --package-lock=false playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install chromium
          node qa/campaign-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Campaign-stars-v60-review
          path: qa/campaign-previews/*
