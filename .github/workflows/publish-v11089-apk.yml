name: Publish Terha Conquest v1.10.89 Direct APK
on:
  push:
    paths:
      - '.github/workflows/publish-v11089-apk.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified signed APK pieces from successful test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables sums
          for n in 00 01 02; do
            mkdir -p "parts/${n}"
            gh run download 39137637708 --name "Terha-v11089-part${n}" --dir "parts/${n}"
          done
          gh run download 39137637708 --name Terha-v11089-SHA256 --dir sums
          for n in 00 01 02; do
            cat "parts/${n}/Terha-Conquest-v1.10.89.apk.part${n}" >> deliverables/Terha-Conquest-v1.10.89.apk
          done
          sha256sum -c sums/SHA256SUMS.txt
          test -s deliverables/Terha-Conquest-v1.10.89.apk
      - name: Publish directly downloadable original-signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.89 >/dev/null 2>&1; then
            gh release upload v1.10.89 deliverables/Terha-Conquest-v1.10.89.apk --clobber
          else
            gh release create v1.10.89 deliverables/Terha-Conquest-v1.10.89.apk --target "$GITHUB_SHA" --title "Terha Conquest v1.10.89" --notes "Signed Android APK. Correct window-chrome title recognition so every city page displays its city name instead of generic Information heading, with faction and level in the actual top title bar. All previous UI/gameplay and terrain preserved; full regression and signing passed."
          fi
          gh release view v1.10.89 --json url,assets
