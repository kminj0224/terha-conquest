name: Verify land campaigns exclude ships and whales
on:
  push:
    branches: [codex/campaign-no-navy61]
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - run: |
          python3 tools/prepare_operation_music.py
          node qa/campaign-no-navy-simulation.cjs
          node qa/campaign-m03-simulation.cjs
