name: Build v1.11.34 resupply and transport APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run game and native shell regression checks
        run: |
          python3 tools/prepare_operation_music.py
          npm test
          python3 qa/verify-native.py
          node qa/supply-routes-regression.cjs
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.34.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.34.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Terha-Conquest-v1.11.34
          path: |
            deliverables/Terha-Conquest-v1.11.34.apk
            deliverables/SHA256SUMS.txt
          retention-days: 14
      - name: Publish signed APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.34 deliverables/Terha-Conquest-v1.11.34.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.34' --notes '유닛 생산비로 체력 전체 보급, 차량화보병 공격력 33, 메카닉 나이트 전차 군종·공격력 96·식량 1000·석유 40, 연속 레이저음, 해군 수송 2턴, 해상 수송로 조건과 도시 배너 시점 이동. versionCode 179.'
