name: Build v1.11.41 Sapros and homeland production APK
on:
  push:
    branches: [main, codex/sapros-v11141]
    paths:
      - 'game/assets/**'
      - 'qa/**'
      - 'build.py'
      - '.github/workflows/build-v11141-sapros.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Set up FFmpeg and FFprobe
        uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify Sapros in real Canvas
        run: |
          python3 tools/prepare_operation_music.py
          node qa/sapros-native-regression.cjs
      - name: Verify game and native shell
        run: |
          node qa/sapros-regression.cjs
          node qa/supply-routes-regression.cjs
          node qa/burst-audio-regression.cjs
          node qa/ayria-infantry-regression.cjs
          node qa/siege-occupation-regression.cjs
          node qa/android-frame-budget-regression.cjs
          npm test
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.41.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.41.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Terha-Conquest-v1.11.41
          path: |
            deliverables/Terha-Conquest-v1.11.41.apk
            deliverables/SHA256SUMS.txt
          retention-days: 14
      - name: Publish signed APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.41 deliverables/Terha-Conquest-v1.11.41.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.41 · 사프로스' --notes '아이리아 특수 유닛 사프로스 추가: 1단계 식량 967, 공격력 97, 체력 989, 사거리 2, 전차 특성, 생산·이동·공격 석유 0, 3타일 아군 보병 공격력 +45%. 첨부 원화 4종, 1.2초 공격 준비 후 타격, 일러스트 혈흔·스파크 및 사망 이미지. 점령도시 생산 창 본토 도시 제목 링크, 항구 표시, 출항 항구 안내. versionCode 186. 자동 전투·생산·저장·Canvas 렌더링·서명 검증 완료. 실물 Android 기기 검증은 별도.'
      - name: Prepare APK download link
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.11.41" --jq '.assets[] | select(.name == "Terha-Conquest-v1.11.41.apk") | .id')
          curl --silent --show-error --max-time 60 --dump-header - --output /dev/null -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" | sed -n 's/^location: /APK_DOWNLOAD_URL=/Ip'
