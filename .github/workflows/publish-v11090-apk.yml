name: Publish Terha Conquest v1.10.90 Direct APK
on:
  push:
    paths:
      - '.github/workflows/publish-v11090-apk.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified signed APK pieces from successful test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deliverables sums
          for n in 00 01 02; do
            mkdir -p "parts/${n}"
            gh run download 39140588766 --name "Terha-v11090-part${n}" --dir "parts/${n}"
          done
          gh run download 39140588766 --name Terha-v11090-SHA256 --dir sums
          for n in 00 01 02; do
            cat "parts/${n}/Terha-Conquest-v1.10.90.apk.part${n}" >> deliverables/Terha-Conquest-v1.10.90.apk
          done
          sha256sum -c sums/SHA256SUMS.txt
          test -s deliverables/Terha-Conquest-v1.10.90.apk
      - name: Publish directly downloadable original-signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.90 >/dev/null 2>&1; then
            gh release upload v1.10.90 deliverables/Terha-Conquest-v1.10.90.apk --clobber
          else
            gh release create v1.10.90 deliverables/Terha-Conquest-v1.10.90.apk --target "$GITHUB_SHA" --title "Terha Conquest v1.10.90" --notes "Signed Android APK. Fix a stale anti-ship coastal-battery information-button handler that incorrectly displayed battery details when inspecting ordinary field units and cities. All previous gameplay and visuals retained; full regression and original signing verified."
          fi
          gh release view v1.10.90 --json url,assets
