name: Publish verified Terha Conquest v1.11.10 directly to Releases
on:
  push:
    branches: [work/organic-terrain-v11110]
    paths: ['.github/workflows/publish-v11110-recovery.yml']
  workflow_dispatch:
concurrency:
  group: aligned-map-release
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  publish-verified-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify unchanged application and the completed regression matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin f970225893d7c307f26173ebb06ba5f44465508f
          git diff --exit-code f970225893d7c307f26173ebb06ba5f44465508f HEAD -- game/assets tools qa build.py package.json package-lock.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39372850982" > /tmp/verified-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39372850982/jobs" > /tmp/verified-jobs.json
          python3 - <<'PY'
          import json
          run=json.load(open('/tmp/verified-run.json'));jobs=json.load(open('/tmp/verified-jobs.json'))['jobs']
          assert run['head_sha']=='f970225893d7c307f26173ebb06ba5f44465508f'
          steps={s['number']:s for j in jobs for s in j['steps']}
          for number in range(6,20):assert steps[number]['conclusion']=='success',steps[number]
          assert steps[20]['name']=='Run actions/upload-artifact@v4' and steps[20]['conclusion']=='failure'
          print('PASS full gameplay, geography, snow, jungle, performance, native shell, APK and original signature already verified')
          PY
      - run: npm ci --no-audit --no-fund
      - name: Reproduce the validated map without using Actions artifact storage
        run: |
          node tools/bake-aligned-map.cjs
          node tools/build-map-lods.cjs
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          hashes=json.loads(Path('art/v11110-validated-map-hashes.json').read_text())
          for name,expected in hashes.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          print('PASS exact validated pixels, ownership masks and scenery audit',len(hashes))
          PY
      - name: Build signed update APK
        run: |
          python3 build.py
          python3 - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          p=Path('deliverables/Terha-Conquest-v1.11.10.apk')
          with zipfile.ZipFile(p) as z,zipfile.ZipFile('android/native-shell.zip') as shell:
            assert z.testzip() is None
            assert z.read('classes.dex')==shell.read('classes.dex')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('deliverables/SHA256SUMS.txt').write_text(digest+'  '+p.name+'\n')
          print('Verified APK SHA256:',digest)
          PY
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.10.apk
      - name: Retain generated map in the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/assets/natural-detail-*.jpg game/assets/natural-mid-*.jpg game/assets/world-natural.png game/assets/world-natural-land.png game/assets/world-ownership-mask.png game/assets/natural-ownership-data.js art/aligned-map-manifest.json art/terrain-alignment-audit.json art/ownership-probes.json art/map-lod-report.json art/river-mouth-audit.json art/scenery-variation-audit.json
          git diff --cached --quiet || git commit -m 'Retain validated v1.11.10 varied scenery and fixed snow masks'
          git push origin HEAD:work/organic-terrain-v11110
      - name: Publish APK directly to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.10 >/dev/null 2>&1; then
            gh release upload v1.11.10 deliverables/Terha-Conquest-v1.11.10.apk deliverables/SHA256SUMS.txt --clobber
          else
            gh release create v1.11.10 deliverables/Terha-Conquest-v1.11.10.apk deliverables/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --title 'Terha Conquest v1.11.10 — Organic Scenery and Protected Snow' --notes 'Balanced territory saturation, deep Dante red-brown, unique fixed mountain and forest variants, and denser canopies on the same 87 Ranna forest tiles. Only actual snow remains white after capture; plains, bark and exposed rock follow their owner. Original geography, terrain rules, saves, native shell, signing identity and map cache optimization retained. Complete regression matrix passed before distribution recovery.'
          fi
