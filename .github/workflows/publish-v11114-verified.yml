name: Publish verified v1.11.14 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v11114-verified.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require the exact sources that passed full regression and signing checks
        run: |
          test "$(git rev-parse HEAD^)" = 766aecb12b9a4f6b5c0f75e4c2487a098301f2b1
          git diff --exit-code HEAD^ HEAD -- game android tools qa build.py package.json package-lock.json
      - name: Rebuild verified source and check update certificate
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.14.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.14.apk > SHA256SUMS.txt
      - name: Publish APK directly without Actions artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.14 deliverables/Terha-Conquest-v1.11.14.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.14 — Ranna Artillery' --notes 'Ranna self-propelled artillery and multiple rocket launcher now use the four supplied original images with idle/firing poses, mirrored facing and aligned muzzle origins. Full gameplay regression, native shell checks and original Android update certificate verified in run 39404519766. Existing gameplay and saves retained. Android versionCode 159.'
