name: Build v1.11.23 special operations
on:
  push:
    branches: [main]
    paths:
      - 'game/assets/special-operations.js'
      - 'game/assets/devil-rider-art.js'
      - 'game/assets/rifle-art.js'
      - 'game/assets/ranna-special.js'
      - 'game/assets/frontline-reinforcements.js'
      - 'qa/special-operations-regression.cjs'
      - '.github/workflows/build-v11123-special-operations.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Focused production cap and boot anchor checks
        run: |
          node - <<'JS'
          const fs=require('fs'),source=fs.readFileSync('qa/native-test.cjs','utf8'),cut=source.indexOf("\nassert.equal(run('appScreen'),'title')");
          if(cut<0)throw Error('Native harness boundary missing');
          fs.writeFileSync('qa/.focused-special.cjs',source.slice(0,cut)+"\n(async()=>{await Promise.all(pending);await require('./special-operations-regression.cjs')({run});process.exit(0)})().catch(e=>{console.error(e);process.exit(1)});");
          JS
          node qa/.focused-special.cjs
          rm qa/.focused-special.cjs
      - name: Native renderer and gameplay regression checks
        run: |
          mkdir -p previews
          npm test
          node qa/mountain-tile-alignment.cjs
          node qa/ocean-world-regression.cjs
          python3 qa/verify-native.py
      - name: Build and verify signed Android update
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.23.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.23.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: Terha-Conquest-v1.11.23
          path: |
            deliverables/*
            previews/special-operations-*.png
          retention-days: 14
      - name: Publish verified APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.23 deliverables/Terha-Conquest-v1.11.23.apk deliverables/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.23 — Special Operations' --notes 'Limit AI special recruitment to one affordable tier-one formation per faction every turn; allow remaining cities to recruit ordinary forces. Persist the turn limit across saves and remove legacy duplicate special orders. Align Black Legion front-row boot edges one pixel above the HP bar in idle/fire poses and both facings; move muzzle flashes with the body. Preserve all v1.11.22 unit stats, visuals, starting forces and original Android update signature. versionCode 168.'
