name: Build Terha Conquest v1.11.0 Exact v1.10.91 Rollback
on:
  push:
    paths:
      - '.github/workflows/build-v11100-apk.yml'
      - 'build.py'
      - 'game/assets/app-shell.js'
      - 'game/assets/saves.js'
      - 'qa/ranna-regression.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify full tree rolled back to v1.10.91 apart from release versions
        run: |
          git fetch --no-tags --depth=1 origin d88f4852c63ee6c8835cdc1365c1a9633471a238
          python3 - <<'PY'
          import subprocess
          original='d88f4852c63ee6c8835cdc1365c1a9633471a238'
          changes=set(subprocess.check_output(['git','diff','--name-only',original,'HEAD'],text=True).splitlines())
          allowed={'build.py','game/assets/app-shell.js','game/assets/saves.js','qa/ranna-regression.cjs',
                   '.github/workflows/build-v11100-apk.yml','.github/workflows/publish-v11100-apk.yml'}
          assert changes==allowed, f'Unexpected changes from original v1.10.91: {sorted(changes^allowed)}'
          from pathlib import Path
          assets=Path('game/assets')
          game=(assets/'game.js').read_text()
          ground=(assets/'static-ground.js').read_text()
          assert "worldImg.src='world-clean.png'" in game
          assert 'g.globalAlpha=.30;g.drawImage(territoryCanvas' in ground
          assert not (assets/'world-natural-coast.png').exists()
          assert not (assets/'world-neutral.png').exists()
          assert not (assets/'world-surface-detail.png').exists()
          print('PASS exact original v1.10.91 tree, except version and release workflow files')
          PY
      - name: Install historical game test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run original v1.10.91 full regression suite
        run: node qa/native-test.cjs
      - name: Verify original Android shell
        run: python3 qa/verify-native.py
      - name: Build original-signed Android v1.11.0 update
        run: python3 build.py
      - name: Verify manifest version 1.11.0 and monotonic versionCode 144
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct
          with zipfile.ZipFile('deliverables/Terha-Conquest-v1.11.0.apk') as z:
              assert z.testzip() is None
              xml=z.read('AndroidManifest.xml')
              dex=z.read('classes.dex')
              assert z.read('assets/game.js').find(b"world-clean.png")>=0
              assert b'world-natural-coast.png' not in z.namelist()
          with zipfile.ZipFile('android/native-shell.zip') as z:
              assert dex==z.read('classes.dex')
          off=8; strings=[]; codes=[]
          while off<len(xml):
              kind,head,size=struct.unpack_from('<HHI',xml,off)
              assert size>0
              if kind==1:
                  count,_,flags,start,_=struct.unpack_from('<IIIII',xml,off+8)
                  assert not flags&0x100
                  for j in range(count):
                      q=off+start+struct.unpack_from('<I',xml,off+head+4*j)[0]
                      n=struct.unpack_from('<H',xml,q)[0]
                      strings.append(xml[q+2:q+2+2*n].decode('utf-16le'))
              if kind==0x102:
                  begin,sz,count=struct.unpack_from('<HHH',xml,off+24)
                  for j in range(count):
                      q=off+16+begin+j*sz
                      key=strings[struct.unpack_from('<I',xml,q+4)[0]]
                      if key=='versionCode':codes.append(struct.unpack_from('<I',xml,q+16)[0])
              off+=size
          assert codes==[144],codes
          assert '1.11.0' in strings and '1.10.65' not in strings,strings
          print('PASS APK versionName 1.11.0, versionCode 144 and original DEX, no recent coastal assets')
          PY
      - name: Verify original signing certificate and checksum
        run: |
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.0.apk
          sha256sum deliverables/Terha-Conquest-v1.11.0.apk > deliverables/SHA256SUMS.txt
      - name: Split signed APK into transport-safe pieces
        run: |
          mkdir -p deliverables/parts
          split -b 90m -d -a 2 deliverables/Terha-Conquest-v1.11.0.apk deliverables/parts/Terha-Conquest-v1.11.0.apk.part
          test -s deliverables/parts/Terha-Conquest-v1.11.0.apk.part00
          test -s deliverables/parts/Terha-Conquest-v1.11.0.apk.part01
          test -s deliverables/parts/Terha-Conquest-v1.11.0.apk.part02
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-v11100-part00
          path: deliverables/parts/Terha-Conquest-v1.11.0.apk.part00
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-v11100-part01
          path: deliverables/parts/Terha-Conquest-v1.11.0.apk.part01
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-v11100-part02
          path: deliverables/parts/Terha-Conquest-v1.11.0.apk.part02
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-v11100-SHA256
          path: deliverables/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
