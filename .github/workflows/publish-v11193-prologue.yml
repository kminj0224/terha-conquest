name: Verify and release prologue v1.11.93
on:
  push:
    branches: [codex/prologue-v11193]
permissions:
  contents: write
concurrency:
  group: prologue-v11193
  cancel-in-progress: false
jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify original uploaded battle illustration
        run: echo '7f165a99e5fe93c95635857cb1203f2483e8be1008fbf3b723f04890521a3372  game/assets/main-campaign-scene-2.png' | sha256sum -c -
      - name: Install regression dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify prologue, shared campaign and native shell
        run: |
          python3 tools/prepare_operation_music.py
          node qa/main-campaign-intro-native.cjs
          node qa/main-campaign-intro-browser.cjs
          node qa/campaign-picker-browser.cjs
          node qa/campaign-browser.cjs
          python3 qa/verify-native.py
      - name: Build signed update APK
        run: python3 build.py
      - name: Verify APK identity, signature and retained source resources
        run: |
          python3 qa/verify-apk-name.py deliverables/Terha-Conquest-v1.11.93.apk
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.93.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          with ZipFile('deliverables/Terha-Conquest-v1.11.93.apk') as z:
              for name in ['main-campaign-scene-2.png','main-campaign-data.js','main-campaign.js','main-intro-typewriter.woff']:
                  assert z.read('assets/'+name)==Path('game/assets',name).read_bytes(), name
              assert hashlib.sha256(z.read('assets/main-campaign-scene-2.png')).hexdigest()=='7f165a99e5fe93c95635857cb1203f2483e8be1008fbf3b723f04890521a3372'
              assert 'button-preview.js' not in z.read('assets/index.html').decode()
          print('PASS exact prologue resources and original battle image inside signed APK; no button preview')
          PY
          cd deliverables
          sha256sum Terha-Conquest-v1.11.93.apk > SHA256SUMS-v1.11.93.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prologue-v11193-screenshots
          path: |
            qa/campaign-previews/main-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Terha-Conquest-v1.11.93
          path: |
            deliverables/Terha-Conquest-v1.11.93.apk
            deliverables/SHA256SUMS-v1.11.93.txt
          if-no-files-found: error
      - name: Publish verified APK after exact source reaches main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 180); do
            main_sha=$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)
            if [ "$main_sha" = "$GITHUB_SHA" ]; then
              if gh release view v1.11.93 >/dev/null 2>&1; then
                test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.11.93 --jq .object.sha)" = "$GITHUB_SHA"
                gh release upload v1.11.93 deliverables/Terha-Conquest-v1.11.93.apk deliverables/SHA256SUMS-v1.11.93.txt --clobber
              else
                gh release create v1.11.93 deliverables/Terha-Conquest-v1.11.93.apk deliverables/SHA256SUMS-v1.11.93.txt --target "$GITHUB_SHA" --title '테르하 : 낙원의 기억 v1.11.93' --notes-file docs/releases/v1.11.93.md
              fi
              exit 0
            fi
            sleep 5
          done
          echo 'Verified source has not reached main; APK release withheld.' >&2
          exit 1
