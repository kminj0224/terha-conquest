name: Publish Gardara v1.11.72 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v11172-gardara.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v11172
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify Gardara and build signed APK
        run: |
          npm ci --no-audit --no-fund
          python3 tools/prepare_operation_music.py
          node qa/gardara-regression.cjs
          node qa/ocean-world-regression.cjs
          python3 qa/verify-native.py
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.72.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.72.apk > SHA256SUMS-v1.11.72.txt
      - name: Publish release with APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.72 >/dev/null 2>&1; then
            gh release upload v1.11.72 deliverables/Terha-Conquest-v1.11.72.apk deliverables/SHA256SUMS-v1.11.72.txt --clobber
          else
            gh release create v1.11.72 deliverables/Terha-Conquest-v1.11.72.apk deliverables/SHA256SUMS-v1.11.72.txt --target "$GITHUB_SHA" --title "Terha Conquest v1.11.72 — 가르다라" --notes "가르다라 추가: 낙월과 아이리아 사이 먼 남쪽 해역의 열대 대륙, 회색 국가색과 영토색, 수도 부루다라 포함 9개 도시. 제공된 보병·국기·수도 이미지, 검정 지붕 도시, 반듯한 측면에서 윗면이 보이는 현대 전차·포병. 특수 병종 아마라한을 지키는 힘무리. 시작 병력은 보병만 배치. 회색 기본 도형 해군과 수송선. 기존 저장 호환 및 Android 업데이트 서명 유지. versionCode 217. 가르다라·해양·저장 호환·서명 검증 통과. 기존 캠페인 M02 자동 공략 테스트 실패는 변경 전 소스에서도 재현됩니다."
          fi
          gh release view v1.11.72 --json url,assets
