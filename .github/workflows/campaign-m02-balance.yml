name: Mission 02 tactical balance report
on:
  push:
    branches: [codex/campaign-polish]
    paths: ['qa/campaign-m02-*', '.github/workflows/campaign-m02-balance.yml']
permissions:
  contents: read
jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
      - run: python3 tools/prepare_operation_music.py
      - run: node qa/campaign-m02-simulation.cjs
