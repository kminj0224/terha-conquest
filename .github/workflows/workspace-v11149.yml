name: Prepare v1.11.49 workspace
on:
  push:
    branches: [codex/slots-apc-v11149]
    paths: ['.github/workflows/workspace-v11149.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git -czf /tmp/terha-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: terha-source-v11149
          path: /tmp/terha-source.tar.gz
          retention-days: 1
