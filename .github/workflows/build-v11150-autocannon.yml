name: Sprite-foot explosions and simultaneous looping smoke v1.11.69 APK
on:
  push:
    branches: [main, codex/campaign-polish]
    paths: ['game/assets/**', 'qa/**', 'build.py', '.github/workflows/build-v11150-autocannon.yml']
permissions:
  contents: write
jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify battlefield layout in Chromium
        timeout-minutes: 10
        run: |
          python3 tools/prepare_operation_music.py
          npm install --no-save --package-lock=false playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npx playwright install chromium
          node qa/battlefield-layout.cjs
          node qa/campaign-compact-browser.cjs
          node qa/campaign-browser.cjs
          node qa/campaign-defense-status-browser.cjs
      - name: Verify save migration, artwork, game and Android shell
        if: github.ref != 'refs/heads/main'
        run: |
          python3 tools/prepare_operation_music.py
          node qa/armored-car-defense-clock.cjs
          node qa/armored-car-audio-clock.cjs
          node qa/burst-audio-regression.cjs
          node qa/armored-car-native.cjs
          npm test
          python3 qa/verify-native.py
      - name: Export campaign review images
        if: always()
        run: |
          python3 - <<'PYREVIEW'
          import pathlib,base64
          for path in sorted(pathlib.Path('qa/campaign-previews').glob('review-*.jpg')):
              encoded=base64.b64encode(path.read_bytes()).decode()
              for offset in range(0,len(encoded),4000):
                  print('CAMPAIGN_REVIEW:'+path.name+':'+str(offset)+':'+encoded[offset:offset+4000])
          PYREVIEW
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: Battlefield-layout-v1.11.69
          path: |
            qa/battlefield-previews/*.png
            qa/campaign-previews/*
      - name: Build and verify signed Android update
        run: |
          node qa/combat-ground-native.cjs
          node qa/combat-sequence-native.cjs
          node qa/combat-impact-routing-native.cjs
          node qa/combat-animation-native.cjs
          node qa/illustrated-combat-native.cjs
          node qa/campaign-defense-status-simulation.cjs
          node qa/campaign-m03-defense-playthrough.cjs
          node qa/campaign-no-navy-simulation.cjs
          node qa/armored-car-defense-clock.cjs
          node qa/armored-car-audio-clock.cjs
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.69.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.69.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Terha-Conquest-v1.11.69
          path: |
            deliverables/Terha-Conquest-v1.11.69.apk
            deliverables/SHA256SUMS.txt
          retention-days: 14
      - name: Publish APK after main integration
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.69 deliverables/Terha-Conquest-v1.11.69.apk deliverables/SHA256SUMS.txt qa/battlefield-previews/*.png qa/campaign-previews/*.png qa/campaign-previews/*.jpg --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.69' --notes '폭발만 피격 유닛 발끝·궤도·바퀴의 불투명 하단에 정렬. 스파크·피 위치 유지. 연기는 크기가 일정한 새 5프레임을 빠르게 반복하며 폭발과 동시에 시작, 약 3초 동안 투명해져 사라짐. 도시 단일 피격·타일 깊이 정렬·동일 타일 연기 병합 유지. 오프라인 하단 좌표로 실행 중 픽셀 읽기 없음. 기존 저장·서명 유지. versionCode 214.'
      - name: Prepare APK file attachment
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYPREVIEWS'
          import pathlib,base64
          path=pathlib.Path('qa/battlefield-previews/battlefield-800.png')
          encoded=base64.b64encode(path.read_bytes()).decode()
          for offset in range(0,len(encoded),4000):
              print('PREVIEW_CHUNK:'+str(offset)+':'+encoded[offset:offset+4000])
          PYPREVIEWS
          export APK_ASSET_API=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/v1.11.69 --jq '.assets[] | select(.name=="Terha-Conquest-v1.11.69.apk") | .url')
          python3 - <<'PYTRANSFER'
          import os, urllib.request, urllib.error, base64
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          request=urllib.request.Request(os.environ['APK_ASSET_API'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream','User-Agent':'Terha-Conquest-delivery'})
          try:
              urllib.request.build_opener(NoRedirect).open(request)
              raise RuntimeError('Expected an asset redirect')
          except urllib.error.HTTPError as response:
              assert response.code==302, response.code
              url=response.headers['Location']
              assert url.startswith('https://release-assets.githubusercontent.com/')
              print('APK_FILE_TRANSFER_B64='+base64.b64encode(url.encode()).decode())
          PYTRANSFER


