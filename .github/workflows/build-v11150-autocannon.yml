name: Battlefield mode selection v1.11.51 APK
on:
  push:
    branches: [main, codex/battlefield-v11151]
    paths: ['game/assets/**', 'qa/**', 'build.py', '.github/workflows/build-v11150-autocannon.yml']
permissions:
  contents: write
jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify save migration, artwork, game and Android shell
        if: github.ref != 'refs/heads/main'
        run: |
          python3 tools/prepare_operation_music.py
          node qa/armored-car-defense-clock.cjs
          node qa/armored-car-audio-clock.cjs
          node qa/burst-audio-regression.cjs
          node qa/armored-car-native.cjs
          npm test
          python3 qa/verify-native.py
      - name: Verify battlefield layout in Chromium
        run: |
          python3 tools/prepare_operation_music.py
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node qa/battlefield-layout.cjs
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: Battlefield-layout-v1.11.51
          path: qa/battlefield-previews/*.png
      - name: Build and verify signed Android update
        run: |
          node qa/armored-car-defense-clock.cjs
          node qa/armored-car-audio-clock.cjs
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.51.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.51.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Terha-Conquest-v1.11.51
          path: |
            deliverables/Terha-Conquest-v1.11.51.apk
            deliverables/SHA256SUMS.txt
          retention-days: 14
      - name: Publish APK after main integration
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.51 deliverables/Terha-Conquest-v1.11.51.apk deliverables/SHA256SUMS.txt qa/battlefield-previews/*.png --target "$GITHUB_SHA" --title 'Terha Conquest v1.11.51' --notes '전장에 캠페인·정복 좌우 배너 선택 화면 추가. 두 버튼을 플레이로 통일하고 설명 문구와 화살표 삭제. 정복은 기존 국가선택 화면으로 연결. 뒤로가기·메뉴 음악·영문 표시 검증. 캠페인 시나리오는 준비 중 화면. Android versionCode 196, 기존 업데이트 인증서 유지.'
      - name: Prepare APK file attachment
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYPREVIEWS'
          import pathlib,base64
          path=pathlib.Path('qa/battlefield-previews/battlefield-800.png')
          encoded=base64.b64encode(path.read_bytes()).decode()
          for offset in range(0,len(encoded),4000):
              print('PREVIEW_CHUNK:'+str(offset)+':'+encoded[offset:offset+4000])
          PYPREVIEWS
          export APK_ASSET_API=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/v1.11.51 --jq '.assets[] | select(.name=="Terha-Conquest-v1.11.51.apk") | .url')
          python3 - <<'PYTRANSFER'
          import os, urllib.request, urllib.error, base64
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          request=urllib.request.Request(os.environ['APK_ASSET_API'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream','User-Agent':'Terha-Conquest-delivery'})
          try:
              urllib.request.build_opener(NoRedirect).open(request)
              raise RuntimeError('Expected an asset redirect')
          except urllib.error.HTTPError as response:
              assert response.code==302, response.code
              url=response.headers['Location']
              assert url.startswith('https://release-assets.githubusercontent.com/')
              print('APK_FILE_TRANSFER_B64='+base64.b64encode(url.encode()).decode())
          PYTRANSFER

