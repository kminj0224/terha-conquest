name: Publish bridge touch and directional hits v1.11.76 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v11176-touch-hits.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v11176
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9553e90441037e1e19354921b88ea678496cb2a3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c
        timeout-minutes: 3
      - name: Verify bridge pointer input, directional hits and unchanged combat rules
        run: |
          npm ci --no-audit --no-fund
          python3 tools/prepare_operation_music.py
          node qa/release-v11176-native.cjs
          node qa/combat-animation-native.cjs
          node qa/combat-impact-routing-native.cjs
          node qa/conquest-ai-simulation.cjs
          node qa/supply-network-regression.cjs
          python3 qa/verify-native.py
      - name: Build and verify original update certificate
        run: |
          python3 build.py
          java -jar tools/ecj.jar -17 -classpath tools/apksig.jar -d tools tools/VerifyCertificate.java
          java -cp tools:tools/apksig.jar VerifyCertificate deliverables/Terha-Conquest-v1.11.76.apk
          cd deliverables
          sha256sum Terha-Conquest-v1.11.76.apk > SHA256SUMS-v1.11.76.txt
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.76 >/dev/null 2>&1; then
            test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/tags/v1.11.76 --jq .object.sha)" = 9553e90441037e1e19354921b88ea678496cb2a3
            gh release upload v1.11.76 deliverables/Terha-Conquest-v1.11.76.apk deliverables/SHA256SUMS-v1.11.76.txt --clobber
          else
            gh release create v1.11.76 deliverables/Terha-Conquest-v1.11.76.apk deliverables/SHA256SUMS-v1.11.76.txt --target 9553e90441037e1e19354921b88ea678496cb2a3 --title 'Terha Conquest v1.11.76 — 교각 터치·피와 스파크 방향 및 중앙 배치' --notes-file docs/releases/v1.11.76.md
          fi
          gh release view v1.11.76 --json url,assets
